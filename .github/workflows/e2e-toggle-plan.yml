name: E2E Toggle Plan

on:
  workflow_dispatch:
    inputs:
      user_id:
        required: true
      plan_id:
        required: true

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Patch user_subscriptions.plan_id
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          SUPABASE_URL="https://bspljbxwbjiqueeyzyat.supabase.co"
          USER_ID="${{ inputs.user_id }}"
          PLAN_ID_TEXT="${{ inputs.plan_id }}"

          if [ "$PLAN_ID_TEXT" = "free" ]; then
            PLAN_UUID="null"
          else
            PLAN_ROW=$(curl -s "$SUPABASE_URL/rest/v1/subscription_plans?plan_id=eq.$PLAN_ID_TEXT&select=id" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY")
            PLAN_UUID="\"$(node -pe 'JSON.parse(process.argv[1])[0].id' "$PLAN_ROW")\""
          fi

          curl -s -w "\nHTTP %{http_code}\n" -X PATCH "$SUPABASE_URL/rest/v1/user_subscriptions?user_id=eq.$USER_ID" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d "{\"plan_id\": $PLAN_UUID}"
