name: One-off Delete Diagnostic Function

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Delete diag-openai-key
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions delete diag-openai-key --project-ref bspljbxwbjiqueeyzyat || echo "already gone"
