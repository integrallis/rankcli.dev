# =============================================================================
# CLI Build Workflow - WASM-Protected npm Package
# =============================================================================
# Builds the rankcli npm package with WASM-protected SEO checks.
#
# Triggers:
# - Push to main (build only)
# - Release created (build + publish to npm)
# - Manual trigger with optional publish
#
# Required secrets:
# - RANKCLI_BUILD_KEY: AES-256 encryption key (base64, 32 bytes)
#
# Publishing to npm uses OIDC (Trusted Publishing) via the publish job's
# id-token: write permission - no npm token stored as a secret. Each of
# the three published packages (@rankcli/agent-runtime, @rankcli/mcp-server,
# @rankcli/cli) has a Trusted Publisher configured on npmjs.com pointing at
# this exact repo + this workflow file. If publishing ever needs re-linking,
# see: npmjs.com/package/<name>/access -> Trusted Publisher.

name: Build CLI

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/agent-runtime/**'
      - 'packages/mcp-server/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  RUST_VERSION: 'stable'

jobs:
  # ---------------------------------------------------------------------------
  # Build WASM-protected CLI package
  # ---------------------------------------------------------------------------
  build:
    name: Build CLI Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/cli/native

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install dependencies
        run: pnpm install

      # Must run before "Build CLI TypeScript" below, which bakes whatever
      # version is in package.json into the bundle via update-version.js
      # (packages/cli's build:js script runs it automatically). This used to
      # only happen in the publish job, AFTER this build already ran and its
      # artifact was uploaded - so a release's actual tag version never made
      # it into the compiled `rankcli --version` string, only into the
      # package.json field npm itself reads. Setting it here, before the
      # build, means both agree.
      - name: Set CLI version from release tag
        if: github.event_name == 'release'
        working-directory: packages/cli
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "Setting version to $VERSION"
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"$VERSION\"|" package.json
          echo "Version set to: $(node -p "require('./package.json').version")"

      # Step 1a: Build agent-runtime's regular dist/ (index.js + index.d.ts)
      # so packages/cli's own TypeScript build - specifically wasm-engine.ts,
      # which imports agent-runtime's AuditIssue type - can resolve it. This
      # was missing here even though the publish job runs it separately;
      # nothing surfaced it until wasm-engine.ts started importing a type
      # from agent-runtime instead of redeclaring its own copy.
      - name: Build agent-runtime
        working-directory: packages/agent-runtime
        run: pnpm build

      # Step 1b: Build agent-runtime WASM bundle (JS → IIFE)
      - name: Build agent-runtime WASM bundle
        working-directory: packages/agent-runtime
        run: pnpm build:wasm

      # Step 2: Build Rust/WASM binary (encrypts JS, embeds in WASM)
      - name: Build CLI WASM binary
        working-directory: packages/cli
        env:
          RANKCLI_BUILD_KEY: ${{ secrets.RANKCLI_BUILD_KEY }}
        run: |
          if [ -z "$RANKCLI_BUILD_KEY" ]; then
            echo "⚠️ RANKCLI_BUILD_KEY not set, using dev key"
            pnpm build:wasm:dev
          else
            echo "✓ Using production encryption key"
            pnpm build:wasm
          fi

      # Step 3: Build TypeScript
      - name: Build CLI TypeScript
        working-directory: packages/cli
        run: pnpm build:js

      # Step 3b: Unit tests, including the spawned-CLI exit-code tests
      # (src/__tests__/exit-codes.test.ts) that CI pipelines depend on - a
      # release must not ship a `rankcli audit` that can't fail a build.
      - name: Run CLI tests
        working-directory: packages/cli
        run: pnpm test

      # Step 4: Run WASM integration tests
      # Note: Full tests only run for dev builds (no RANKCLI_BUILD_KEY)
      # Production builds just verify WASM loads correctly
      - name: Test WASM integration
        working-directory: packages/cli
        env:
          RANKCLI_BUILD_KEY: ${{ secrets.RANKCLI_BUILD_KEY }}
        run: |
          if [ -z "$RANKCLI_BUILD_KEY" ]; then
            echo "Running full test suite (dev build)..."
            pnpm test:wasm
          else
            echo "Running production build verification..."
            node -e "
              const wasm = require('./wasm/rankcli_audit_engine.js');
              console.log('✓ WASM module loaded');
              console.log('✓ Exports:', Object.keys(wasm).join(', '));
              if (typeof wasm.init_engine !== 'function') {
                console.error('✗ init_engine not found');
                process.exit(1);
              }
              console.log('✓ init_engine function available');
              console.log('Production WASM verified successfully!');
            "
          fi

      # Step 5: Verify package contents
      - name: Verify package
        working-directory: packages/cli
        run: |
          echo "📦 Package contents:"
          npm pack --dry-run

          echo ""
          echo "📊 WASM binary size:"
          ls -lh wasm/rankcli_audit_engine_bg.wasm

      # Step 6: Upload artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rankcli-package
          path: |
            packages/cli/dist/
            packages/cli/wasm/
            packages/cli/package.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish to npm (only on release or manual trigger)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    permissions:
      contents: write # also commits packages/cli's version bump back to main on a release publish
      id-token: write # required for npm OIDC / Trusted Publishing - no NPM_TOKEN needed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # OIDC/Trusted Publishing needs npm >=11.5.1; pinned separately from
          # the build job's NODE_VERSION (20) so the native WASM build stays
          # untouched. Node 20 can't run `npm install -g npm@latest` (that
          # command itself now requires Node >=22 - the exact issue fixed in
          # .devcontainer/Dockerfile earlier this session), hence 22 here.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC support
        run: npm install -g npm@latest

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rankcli-package
          path: packages/cli/

      - name: Install dependencies
        run: |
          max_attempts=10
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "📦 pnpm install attempt $attempt/$max_attempts"
            if pnpm install; then
              echo "✅ Install succeeded on attempt $attempt"
              exit 0
            fi
            echo "❌ Attempt $attempt failed, waiting before retry..."
            sleep $((attempt * 5))  # Exponential backoff: 5s, 10s, 15s...
            attempt=$((attempt + 1))
          done
          echo "💀 All $max_attempts attempts failed"
          exit 1

      - name: Build agent-runtime
        working-directory: packages/agent-runtime
        run: pnpm build

      - name: Publish agent-runtime
        working-directory: packages/agent-runtime
        run: |
          # Check if version already exists
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view @rankcli/agent-runtime@$CURRENT_VERSION version 2>/dev/null; then
            echo "ℹ️ @rankcli/agent-runtime@$CURRENT_VERSION already published, skipping"
          else
            echo "📦 Publishing @rankcli/agent-runtime@$CURRENT_VERSION"
            npm publish --access public
          fi

      - name: Build MCP server
        working-directory: packages/mcp-server
        run: pnpm build

      - name: Fix MCP server workspace dependency
        working-directory: packages/mcp-server
        run: |
          RUNTIME_VERSION=$(cd ../agent-runtime && node -p "require('./package.json').version")
          echo "Replacing workspace:* with ^$RUNTIME_VERSION"
          sed -i "s|\"workspace:\\*\"|\"^$RUNTIME_VERSION\"|g" package.json

      - name: Publish MCP server
        working-directory: packages/mcp-server
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view @rankcli/mcp-server@$CURRENT_VERSION version 2>/dev/null; then
            echo "ℹ️ @rankcli/mcp-server@$CURRENT_VERSION already published, skipping"
          else
            echo "📦 Publishing @rankcli/mcp-server@$CURRENT_VERSION"
            npm publish --access public
          fi

      # Anthropic's official MCP Registry (registry.modelcontextprotocol.io) -
      # separate from npm, this is what mcp.so/Claude's own directory surface
      # search against. Only on a real release, not workflow_dispatch, so
      # this only ever fires alongside an actual version bump.
      - name: Sync server.json version
        if: github.event_name == 'release'
        working-directory: packages/mcp-server
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp.json
          mv server.tmp.json server.json

      - name: Install mcp-publisher
        if: github.event_name == 'release'
        working-directory: packages/mcp-server
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        if: github.event_name == 'release'
        working-directory: packages/mcp-server
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
        continue-on-error: true # distribution nice-to-have, never block the npm publish this job already completed

      - name: Inject production config
        working-directory: packages/cli
        env:
          RANKCLI_SUPABASE_URL: ${{ secrets.RANKCLI_SUPABASE_URL }}
          RANKCLI_SUPABASE_ANON_KEY: ${{ secrets.RANKCLI_SUPABASE_ANON_KEY }}
          RANKCLI_WEB_URL: https://rankcli.dev
          # Same key native/build.rs used to encrypt the WASM-embedded
          # premium checks - needed here so the published CLI can decrypt
          # them for entitled (paid apiKey) users. See wasm-engine.ts.
          RANKCLI_BUILD_KEY: ${{ secrets.RANKCLI_BUILD_KEY }}
        run: node scripts/inject-config.js

      - name: Final workspace dependency fix
        working-directory: packages/cli
        run: |
          echo "Before fix:"
          cat package.json | grep -A2 '"dependencies"'
          
          RUNTIME_VERSION=$(cd ../agent-runtime && node -p "require('./package.json').version")
          echo "Runtime version: $RUNTIME_VERSION"
          sed -i "s|\"workspace:\\*\"|\"^$RUNTIME_VERSION\"|g" package.json
          
          echo "After fix:"
          cat package.json | grep -A2 '"dependencies"'

      - name: Publish CLI to npm
        working-directory: packages/cli
        run: |
          echo "Publishing @rankcli/cli@$(node -p "require('./package.json').version")"
          npm publish --access public --ignore-scripts

      - name: Commit version bump back to main
        if: github.event_name == 'release'
        run: |
          # This step only runs on a real release, publishing always
          # succeeded to get here, and the version was only ever bumped
          # in-memory by "Set CLI version from release tag" above - commit
          # it back so package.json in git matches what's actually live on
          # npm. Work from a clean checkout of packages/cli/package.json
          # (not the one mutated in-place above) so the "Final workspace
          # dependency fix" step's workspace:* -> pinned-version rewrite,
          # which is only correct for the published tarball, never lands
          # in git.
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          # A same-directory `git checkout main` (tried previously) does NOT
          # discard the "Final workspace dependency fix" step's uncommitted
          # workspace:* -> pinned-version rewrite still sitting in this
          # working tree - checkout-by-branch-name preserves uncommitted
          # local modifications through the switch instead of resetting
          # them, so that commit captured both changes and broke
          # `pnpm install --frozen-lockfile` on main. Use a fully separate
          # worktree instead, with no relation to this directory's
          # uncommitted state, and fetched fresh so the commit lands as a
          # fast-forward even if main has moved since the release tag.
          git fetch origin main
          git worktree add /tmp/version-bump origin/main
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"$VERSION\"|" /tmp/version-bump/packages/cli/package.json
          cd /tmp/version-bump
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add packages/cli/package.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(cli): bump published version to $VERSION

          Auto-committed after a successful npm publish so package.json in
          git matches what's live on npm - see build-cli.yml.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          # `git worktree add <path> origin/main` checks out a detached
          # HEAD at that commit, not a local branch named main - `git push
          # origin main` has no local "main" ref to find. HEAD:main maps
          # the current (detached) commit to the remote branch explicitly,
          # which works regardless of whether HEAD is on a named branch.
          git push origin HEAD:main

      - name: Create publish summary
        run: |
          VERSION=$(cd packages/cli && node -p "require('./package.json').version")
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 📦 Published to npm

          **Package:** @rankcli/cli
          EOF
          echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'

          Install with:
          ```bash
          npm install -g @rankcli/cli
          ```
          EOF
