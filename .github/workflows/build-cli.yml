# =============================================================================
# CLI Build Workflow - WASM-Protected npm Package
# =============================================================================
# Builds the rankcli npm package with WASM-protected SEO checks.
#
# Triggers:
# - Push to main (build only)
# - Release created (build + publish to npm)
# - Manual trigger with optional publish
#
# Required secrets:
# - RANKCLI_BUILD_KEY: AES-256 encryption key (base64, 32 bytes)
# - NPM_TOKEN: npm access token for publishing

name: Build CLI

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/agent-runtime/**'
      - 'packages/mcp-server/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  RUST_VERSION: 'stable'

jobs:
  # ---------------------------------------------------------------------------
  # Build WASM-protected CLI package
  # ---------------------------------------------------------------------------
  build:
    name: Build CLI Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/cli/native

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install dependencies
        run: pnpm install

      # Step 1: Build agent-runtime WASM bundle (JS → IIFE)
      - name: Build agent-runtime WASM bundle
        working-directory: packages/agent-runtime
        run: pnpm build:wasm

      # Step 2: Build Rust/WASM binary (encrypts JS, embeds in WASM)
      - name: Build CLI WASM binary
        working-directory: packages/cli
        env:
          RANKCLI_BUILD_KEY: ${{ secrets.RANKCLI_BUILD_KEY }}
        run: |
          if [ -z "$RANKCLI_BUILD_KEY" ]; then
            echo "⚠️ RANKCLI_BUILD_KEY not set, using dev key"
            pnpm build:wasm:dev
          else
            echo "✓ Using production encryption key"
            pnpm build:wasm
          fi

      # Step 3: Build TypeScript
      - name: Build CLI TypeScript
        working-directory: packages/cli
        run: pnpm build:js

      # Step 4: Run WASM integration tests
      # Note: Full tests only run for dev builds (no RANKCLI_BUILD_KEY)
      # Production builds just verify WASM loads correctly
      - name: Test WASM integration
        working-directory: packages/cli
        env:
          RANKCLI_BUILD_KEY: ${{ secrets.RANKCLI_BUILD_KEY }}
        run: |
          if [ -z "$RANKCLI_BUILD_KEY" ]; then
            echo "Running full test suite (dev build)..."
            pnpm test:wasm
          else
            echo "Running production build verification..."
            node -e "
              const wasm = require('./wasm/rankcli_audit_engine.js');
              console.log('✓ WASM module loaded');
              console.log('✓ Exports:', Object.keys(wasm).join(', '));
              if (typeof wasm.init_engine !== 'function') {
                console.error('✗ init_engine not found');
                process.exit(1);
              }
              console.log('✓ init_engine function available');
              console.log('Production WASM verified successfully!');
            "
          fi

      # Step 5: Verify package contents
      - name: Verify package
        working-directory: packages/cli
        run: |
          echo "📦 Package contents:"
          npm pack --dry-run

          echo ""
          echo "📊 WASM binary size:"
          ls -lh wasm/rankcli_audit_engine_bg.wasm

      # Step 6: Upload artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rankcli-package
          path: |
            packages/cli/dist/
            packages/cli/wasm/
            packages/cli/package.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish to npm (only on release or manual trigger)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rankcli-package
          path: packages/cli/

      - name: Install dependencies
        run: |
          max_attempts=10
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "📦 pnpm install attempt $attempt/$max_attempts"
            if pnpm install; then
              echo "✅ Install succeeded on attempt $attempt"
              exit 0
            fi
            echo "❌ Attempt $attempt failed, waiting before retry..."
            sleep $((attempt * 5))  # Exponential backoff: 5s, 10s, 15s...
            attempt=$((attempt + 1))
          done
          echo "💀 All $max_attempts attempts failed"
          exit 1

      - name: Build agent-runtime
        working-directory: packages/agent-runtime
        run: pnpm build

      - name: Diagnose NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "--- npm whoami (confirms the token authenticates at all) ---"
          npm whoami --registry https://registry.npmjs.org/ || echo "whoami FAILED"
          echo "--- npm profile get (token/account restrictions sometimes surface here) ---"
          npm profile get --registry https://registry.npmjs.org/ 2>&1 || echo "profile get FAILED (may be expected for automation tokens)"
          echo "--- npm access list packages (confirms scope/permission on @rankcli) ---"
          npm access list packages @rankcli --registry https://registry.npmjs.org/ 2>&1 || echo "access list FAILED"

      - name: Publish agent-runtime
        working-directory: packages/agent-runtime
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Check if version already exists
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view @rankcli/agent-runtime@$CURRENT_VERSION version 2>/dev/null; then
            echo "ℹ️ @rankcli/agent-runtime@$CURRENT_VERSION already published, skipping"
          else
            echo "📦 Publishing @rankcli/agent-runtime@$CURRENT_VERSION"
            npm publish --access public
          fi

      - name: Build MCP server
        working-directory: packages/mcp-server
        run: pnpm build

      - name: Fix MCP server workspace dependency
        working-directory: packages/mcp-server
        run: |
          RUNTIME_VERSION=$(cd ../agent-runtime && node -p "require('./package.json').version")
          echo "Replacing workspace:* with ^$RUNTIME_VERSION"
          sed -i "s|\"workspace:\\*\"|\"^$RUNTIME_VERSION\"|g" package.json

      - name: Publish MCP server
        working-directory: packages/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view @rankcli/mcp-server@$CURRENT_VERSION version 2>/dev/null; then
            echo "ℹ️ @rankcli/mcp-server@$CURRENT_VERSION already published, skipping"
          else
            echo "📦 Publishing @rankcli/mcp-server@$CURRENT_VERSION"
            npm publish --access public
          fi

      - name: Inject production config
        working-directory: packages/cli
        env:
          RANKCLI_SUPABASE_URL: ${{ secrets.RANKCLI_SUPABASE_URL }}
          RANKCLI_SUPABASE_ANON_KEY: ${{ secrets.RANKCLI_SUPABASE_ANON_KEY }}
          RANKCLI_WEB_URL: https://rankcli.dev
        run: node scripts/inject-config.js

      - name: Final workspace dependency fix
        working-directory: packages/cli
        run: |
          echo "Before fix:"
          cat package.json | grep -A2 '"dependencies"'
          
          RUNTIME_VERSION=$(cd ../agent-runtime && node -p "require('./package.json').version")
          echo "Runtime version: $RUNTIME_VERSION"
          sed -i "s|\"workspace:\\*\"|\"^$RUNTIME_VERSION\"|g" package.json
          
          echo "After fix:"
          cat package.json | grep -A2 '"dependencies"'

      - name: Set CLI version from release tag
        if: github.event_name == 'release'
        working-directory: packages/cli
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "Setting version to $VERSION"
          # Use sed instead of npm version to avoid workspace:* resolution issues
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"$VERSION\"|" package.json
          echo "Version set to: $(node -p "require('./package.json').version")"

      - name: Publish CLI to npm
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing @rankcli/cli@$(node -p "require('./package.json').version")"
          npm publish --access public --ignore-scripts

      - name: Create publish summary
        run: |
          VERSION=$(cd packages/cli && node -p "require('./package.json').version")
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 📦 Published to npm

          **Package:** @rankcli/cli
          EOF
          echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'

          Install with:
          ```bash
          npm install -g @rankcli/cli
          ```
          EOF
