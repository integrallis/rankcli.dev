# =============================================================================
# CLI Build Workflow - WASM-Protected npm Package
# =============================================================================
# Builds the rankcli npm package with WASM-protected SEO checks.
#
# Triggers:
# - Push to main (build only)
# - Release created (build + publish to npm)
# - Manual trigger with optional publish
#
# Required secrets:
# - RANKCLI_BUILD_KEY: AES-256 encryption key (base64, 32 bytes)
# - NPM_TOKEN: npm access token for publishing

name: Build CLI

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/agent-runtime/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  RUST_VERSION: 'stable'

jobs:
  # ---------------------------------------------------------------------------
  # Build WASM-protected CLI package
  # ---------------------------------------------------------------------------
  build:
    name: Build CLI Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/cli/native

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install dependencies
        run: pnpm install

      # Step 1: Build agent-runtime WASM bundle (JS → IIFE)
      - name: Build agent-runtime WASM bundle
        working-directory: packages/agent-runtime
        run: pnpm build:wasm

      # Step 2: Build Rust/WASM binary (encrypts JS, embeds in WASM)
      - name: Build CLI WASM binary
        working-directory: packages/cli
        env:
          RANKCLI_BUILD_KEY: ${{ secrets.RANKCLI_BUILD_KEY }}
        run: |
          if [ -z "$RANKCLI_BUILD_KEY" ]; then
            echo "⚠️ RANKCLI_BUILD_KEY not set, using dev key"
            pnpm build:wasm:dev
          else
            echo "✓ Using production encryption key"
            pnpm build:wasm
          fi

      # Step 3: Build TypeScript
      - name: Build CLI TypeScript
        working-directory: packages/cli
        run: pnpm build:js

      # Step 4: Run WASM integration tests
      - name: Test WASM integration
        working-directory: packages/cli
        run: pnpm test:wasm

      # Step 5: Verify package contents
      - name: Verify package
        working-directory: packages/cli
        run: |
          echo "📦 Package contents:"
          npm pack --dry-run

          echo ""
          echo "📊 WASM binary size:"
          ls -lh wasm/rankcli_audit_engine_bg.wasm

      # Step 6: Upload artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rankcli-package
          path: |
            packages/cli/dist/
            packages/cli/wasm/
            packages/cli/package.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish to npm (only on release or manual trigger)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rankcli-package
          path: packages/cli/

      - name: Publish to npm
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Set version from release tag if available
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix if present
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi

          echo "📦 Publishing rankcli@$(node -p "require('./package.json').version")"
          npm publish --access public

      - name: Create publish summary
        run: |
          echo "## 📦 Published to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** rankcli" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $(cd packages/cli && node -p \"require('./package.json').version\")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install rankcli" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
