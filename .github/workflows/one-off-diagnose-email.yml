name: One-off Diagnose Email Routing
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check routing sync status and DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=rankcli.dev" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id')
          echo "Zone ID: $ZONE_ID"

          echo "=== Email routing zone status ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.'

          echo "=== DNS records owned by Cloudflare Email Routing (search for MX/TXT/CNAME) ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.result[] | select(.type == "MX" or .type == "TXT" or .name == "rankcli.dev") | {type, name, content, proxied, ttl}'
