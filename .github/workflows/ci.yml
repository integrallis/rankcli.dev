# =============================================================================
# CI Workflow - Tests and Validation
# =============================================================================
# Runs on pull requests and pushes to main.
# Validates code quality before deployment.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------------------
  # Detect which components changed
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      saas: ${{ steps.filter.outputs.saas }}
      plugins: ${{ steps.filter.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            saas:
              - 'packages/saas/**'
            plugins:
              - 'packages/vscode-extension/**'

  # ---------------------------------------------------------------------------
  # SaaS Frontend Tests
  # ---------------------------------------------------------------------------
  saas-tests:
    name: SaaS Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.saas == 'true' || github.event_name == 'push'

    defaults:
      run:
        working-directory: packages/saas

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Nothing ran these, which is how an OOM that hid two never-passing
      # tests went unnoticed. (The `pnpm lint || true` step that stood here
      # could never pass - saas has no ESLint installed - and is dropped;
      # ci-saas.yml keeps the lint job, still non-blocking, for when it does.)
      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  # ---------------------------------------------------------------------------
  # Plugin Tests
  # ---------------------------------------------------------------------------
  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.plugins == 'true' || github.event_name == 'push'

    strategy:
      matrix:
        plugin: [vscode-extension]

    defaults:
      run:
        working-directory: packages/${{ matrix.plugin }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Summary job that other workflows can depend on
  # ---------------------------------------------------------------------------
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [changes, saas-tests, plugin-tests]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.saas-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.plugin-tests.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
