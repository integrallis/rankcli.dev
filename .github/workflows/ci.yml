# =============================================================================
# CI Workflow - Tests and Validation
# =============================================================================
# Runs on pull requests and pushes to main.
# Validates code quality before deployment.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # ---------------------------------------------------------------------------
  # Detect which components changed
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      saas: ${{ steps.filter.outputs.saas }}
      cli: ${{ steps.filter.outputs.cli }}
      agent: ${{ steps.filter.outputs.agent }}
      plugins: ${{ steps.filter.outputs.plugins }}
      native: ${{ steps.filter.outputs.native }}
      action: ${{ steps.filter.outputs.action }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            saas:
              - 'packages/saas/**'
            cli:
              - 'packages/cli/**'
            agent:
              - 'packages/agent-runtime/**'
            plugins:
              - 'packages/vite-plugin/**'
              - 'packages/next-plugin/**'
              - 'packages/astro-plugin/**'
              - 'packages/vscode-extension/**'
            native:
              - 'packages/cli/native/**'
            action:
              - 'packages/github-action/**'
            mcp:
              - 'packages/mcp-server/**'

  # ---------------------------------------------------------------------------
  # SaaS Frontend Tests
  # ---------------------------------------------------------------------------
  saas-tests:
    name: SaaS Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.saas == 'true' || github.event_name == 'push'

    defaults:
      run:
        working-directory: packages/saas

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Nothing ran these, which is how an OOM that hid two never-passing
      # tests went unnoticed. (The `pnpm lint || true` step that stood here
      # could never pass - saas has no ESLint installed - and is dropped;
      # ci-saas.yml keeps the lint job, still non-blocking, for when it does.)
      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  # ---------------------------------------------------------------------------
  # Agent Runtime Tests
  # ---------------------------------------------------------------------------
  agent-tests:
    name: Agent Runtime Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agent == 'true' || github.event_name == 'push'

    defaults:
      run:
        working-directory: packages/agent-runtime

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  # ---------------------------------------------------------------------------
  # CLI Tests (includes WASM build)
  # ---------------------------------------------------------------------------
  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.native == 'true' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/cli/native

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install dependencies
        run: pnpm install

      - name: Build agent-runtime
        working-directory: packages/agent-runtime
        run: pnpm build

      - name: Build agent-runtime WASM bundle
        working-directory: packages/agent-runtime
        run: pnpm build:wasm

      - name: Build CLI (with WASM)
        working-directory: packages/cli
        run: |
          pnpm build:wasm:dev
          pnpm build:js

      - name: Run WASM integration tests
        working-directory: packages/cli
        run: pnpm test:wasm

      - name: Run unit tests
        working-directory: packages/cli
        run: pnpm test

  # ---------------------------------------------------------------------------
  # Plugin Tests
  # ---------------------------------------------------------------------------
  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.plugins == 'true' || github.event_name == 'push'

    strategy:
      matrix:
        plugin: [vite-plugin, next-plugin, astro-plugin, vscode-extension]

    defaults:
      run:
        working-directory: packages/${{ matrix.plugin }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

  # ---------------------------------------------------------------------------
  # GitHub Action + MCP server (both bundle agent-runtime, so build it first)
  # ---------------------------------------------------------------------------
  action-tests:
    name: GitHub Action Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.action == 'true' || needs.changes.outputs.agent == 'true' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build agent-runtime
        working-directory: packages/agent-runtime
        run: pnpm build

      # The ncc bundle is what users run; dist.test.ts executes it the way
      # the Actions runner does.
      - name: Build action
        working-directory: packages/github-action
        run: pnpm build

      - name: Type check
        working-directory: packages/github-action
        run: pnpm exec tsc --noEmit

      - name: Run tests
        working-directory: packages/github-action
        run: pnpm test

  mcp-tests:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mcp == 'true' || needs.changes.outputs.agent == 'true' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build agent-runtime
        working-directory: packages/agent-runtime
        run: pnpm build

      - name: Build
        working-directory: packages/mcp-server
        run: pnpm build

      - name: Type check
        working-directory: packages/mcp-server
        run: pnpm exec tsc --noEmit

      - name: Run tests
        working-directory: packages/mcp-server
        run: pnpm test

  # ---------------------------------------------------------------------------
  # Summary job that other workflows can depend on
  # ---------------------------------------------------------------------------
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [changes, saas-tests, agent-tests, cli-tests, plugin-tests, action-tests, mcp-tests]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.saas-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.agent-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.cli-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.plugin-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.action-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.mcp-tests.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
