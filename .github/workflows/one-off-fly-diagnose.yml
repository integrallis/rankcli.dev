name: One-off Fly Diagnose
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Status and machine list
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== flyctl status ==="
          flyctl status -a rankcli-audit-worker
          echo "=== flyctl machine list ==="
          flyctl machine list -a rankcli-audit-worker
          echo "=== flyctl machine status (each) ==="
          for m in $(flyctl machine list -a rankcli-audit-worker -j | jq -r '.[].id'); do
            echo "--- $m ---"
            flyctl machine status "$m" -a rankcli-audit-worker || true
          done
