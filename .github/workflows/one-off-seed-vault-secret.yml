name: One-off Seed Vault Secret
on:
  workflow_dispatch:
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Seed internal_webhook_secret into Supabase Vault via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SECRET_VALUE: ${{ secrets.INTERNAL_WEBHOOK_SECRET }}
        run: |
          QUERY=$(printf 'select vault.create_secret(%s, %s, %s);' \
            "'$SECRET_VALUE'" \
            "'internal_webhook_secret'" \
            "'Shared secret for pg_net triggers calling notify-slack'")
          curl -s -X POST "https://api.supabase.com/v1/projects/plfhfykcoytxkjxnjnez/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg q "$QUERY" '{query: $q}')" | jq '.'
