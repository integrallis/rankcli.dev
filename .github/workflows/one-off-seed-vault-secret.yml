name: One-off Seed Vault Secret
on:
  workflow_dispatch:
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
      - name: Seed internal_webhook_secret into Supabase Vault
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SECRET_VALUE: ${{ secrets.INTERNAL_WEBHOOK_SECRET }}
        run: |
          QUERY=$(printf "select vault.create_secret('%s', 'internal_webhook_secret', 'Shared secret for pg_net triggers calling notify-slack');" "$SECRET_VALUE")
          supabase db query "$QUERY"
