name: One-off Seed Vault Secret
on:
  workflow_dispatch:
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Seed internal_webhook_secret into Supabase Vault
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SECRET_VALUE: ${{ secrets.INTERNAL_WEBHOOK_SECRET }}
        run: |
          psql "postgresql://postgres@db.plfhfykcoytxkjxnjnez.supabase.co:5432/postgres" -v ON_ERROR_STOP=1 <<SQL
          select vault.create_secret('${SECRET_VALUE}', 'internal_webhook_secret', 'Shared secret for pg_net triggers calling notify-slack');
          SQL
          echo "Seeded (value not logged)"
