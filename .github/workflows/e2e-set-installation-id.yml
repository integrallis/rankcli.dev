name: E2E Set Installation Id

on:
  workflow_dispatch:
    inputs:
      project_id:
        required: true
      installation_id:
        required: true

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Patch project's github_installation_id
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          SUPABASE_URL="https://bspljbxwbjiqueeyzyat.supabase.co"
          curl -s -w "\nHTTP %{http_code}\n" -X PATCH \
            "$SUPABASE_URL/rest/v1/projects?id=eq.${{ inputs.project_id }}" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"github_installation_id\": ${{ inputs.installation_id }}}"
