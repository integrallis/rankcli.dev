name: E2E Check Checkout

on:
  workflow_dispatch:
    inputs:
      email:
        required: true
      password:
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in and create a real checkout session
        env:
          ANON_KEY: ${{ secrets.RANKCLI_SUPABASE_ANON_KEY }}
          EMAIL: ${{ inputs.email }}
          PASSWORD: ${{ inputs.password }}
        run: |
          set -euo pipefail
          SUPABASE_URL="https://bspljbxwbjiqueeyzyat.supabase.co"

          SIGNIN_RESP=$(curl -s -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          ACCESS_TOKEN=$(node -pe 'JSON.parse(process.argv[1]).access_token' "$SIGNIN_RESP" 2>/dev/null || echo "")
          echo "::add-mask::$ACCESS_TOKEN"
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "undefined" ]; then
            echo "Sign-in failed:"; echo "$SIGNIN_RESP"; exit 1
          fi

          echo "=== creating checkout session for 'pro' plan ==="
          RESP=$(curl -s -w "\nHTTP %{http_code}\n" -X POST "$SUPABASE_URL/functions/v1/create-checkout" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d '{"priceId":"price_1SvP3nDrTThI0RtSqKAEpLOb","planId":"pro","successUrl":"https://rankcli.dev/account?success=true","cancelUrl":"https://rankcli.dev/account?canceled=true"}')
          echo "$RESP"
