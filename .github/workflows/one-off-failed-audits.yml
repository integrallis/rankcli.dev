name: One-off - inspect failed audits

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Failed audits with owner email
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT a.id AS audit_id, a.project_id, p.domain, p.name AS project_name,
                   u.email, a.triggered_by, a.created_at, a.summary
            FROM audits a
            JOIN projects p ON p.id = a.project_id
            JOIN auth.users u ON u.id = p.user_id
            WHERE a.status = 'failed'
            ORDER BY a.created_at DESC;
          " --linked
