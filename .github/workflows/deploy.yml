# =============================================================================
# Main Deployment Workflow
# =============================================================================
# Deploys frontend to Cloudflare Pages, audit worker to Fly.io,
# and runs Supabase migrations
# Triggered on release creation or manual dispatch
#
# Required Secrets (set in GitHub repo Settings > Secrets):
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_ACCOUNT_ID
# - SUPABASE_ACCESS_TOKEN
# - SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_KEY
# - SUPABASE_DB_PASSWORD
# - STRIPE_SECRET_KEY
# - STRIPE_WEBHOOK_SECRET
# - FLY_API_TOKEN
# - AUDIT_WORKER_SECRET
# - OPENAI_API_KEY
#
# Optional Secrets:
# - RESEND_API_KEY         (Resend.com - transactional emails, 3,000 free/month)
# - BRAVE_API_KEY          (Brave Search API - 2,000 free/month)
# - SERPER_API_KEY         (Serper.dev Google Search - 2,500 free/month)
# - GITHUB_TOKEN_SEARCH    (GitHub PAT for increased rate limits - no scopes needed)

name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: 'Deploy frontend'
        type: boolean
        default: true
      deploy_worker:
        description: 'Deploy audit worker (Fly.io)'
        type: boolean
        default: true
      run_migrations:
        description: 'Run database migrations'
        type: boolean
        default: true
      deploy_edge_functions:
        description: 'Deploy Supabase edge functions'
        type: boolean
        default: true
      sync_stripe_pricing:
        description: 'Sync pricing to Stripe'
        type: boolean
        default: false

env:
  CLOUDFLARE_PROJECT_NAME: rankcli

jobs:
  # ---------------------------------------------------------------------------
  # Preflight Check - Verify secrets are configured
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight Check
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required secrets
        id: check
        run: |
          MISSING=""
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then MISSING="$MISSING CLOUDFLARE_API_TOKEN"; fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then MISSING="$MISSING SUPABASE_ACCESS_TOKEN"; fi
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then MISSING="$MISSING FLY_API_TOKEN"; fi

          if [ -n "$MISSING" ]; then
            echo "## ⏭️ Deployment Skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Missing required secrets:$MISSING" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please configure secrets in **Settings → Secrets and variables → Actions**" >> $GITHUB_STEP_SUMMARY
            echo "See [DEPLOYMENT.md](../blob/main/DEPLOYMENT.md) for setup instructions." >> $GITHUB_STEP_SUMMARY
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "## ✅ Preflight Check Passed" >> $GITHUB_STEP_SUMMARY
            echo "All required secrets are configured." >> $GITHUB_STEP_SUMMARY
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Detect Changes
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}
      functions: ${{ steps.filter.outputs.functions }}
      pricing: ${{ steps.filter.outputs.pricing }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      # Full history, not the default shallow (depth-1) clone - paths-filter
      # needs real commits to diff against below. Without this, `base` (and
      # dorny/paths-filter's own before/after fallback on push events) has
      # nothing to resolve, and the action's documented safe-default is to
      # report every filter as changed - which is what silently made the
      # run_migrations/deploy_edge_functions/sync_stripe_pricing toggles
      # above no-op on every workflow_dispatch run so far.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # paths-filter's `base` must be a real ref/SHA it can `git fetch` -
      # relative expressions like HEAD~1 aren't valid there (confirmed:
      # "fatal: invalid refspec 'HEAD~1'"), so resolve it to a concrete SHA
      # first. Falls back to HEAD itself (an empty, harmless diff) on a
      # single-commit repo where HEAD~1 doesn't exist.
      - name: Resolve diff base
        id: base
        run: echo "sha=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # push events (if this workflow ever gets one) have a real
          # before-SHA to diff against; release/workflow_dispatch don't, so
          # fall back to just the most recent commit - an honest "did the
          # last change touch this path", not a guess at some undefined
          # "since last deploy" window this repo doesn't track anywhere.
          base: ${{ github.event.before || steps.base.outputs.sha }}
          filters: |
            frontend:
              - 'packages/saas/**'
            migrations:
              - 'packages/saas/supabase/migrations/**'
            functions:
              - 'packages/saas/supabase/functions/**'
            pricing:
              - 'packages/saas/src/config/pricing-tiers.json'
            worker:
              - 'packages/audit-worker/**'
              - 'packages/agent-runtime/**'

  # ---------------------------------------------------------------------------
  # Deploy Frontend to Cloudflare Pages
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [preflight, changes]
    if: |
      needs.preflight.outputs.ready == 'true' && (
        github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_frontend == 'true' ||
        github.event_name == 'release' ||
        needs.changes.outputs.frontend == 'true'
      )

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap dates each page by its last commit.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: packages/saas
        run: pnpm install

      # The build prerenders the public pages in headless Chromium
      # (scripts/prerender.ts). Installs the version @playwright/test pins.
      - name: Install Chromium for prerendering
        working-directory: packages/saas
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Build
        working-directory: packages/saas
        env:
          # Fail the deploy rather than ship pages crawlers can't read.
          PRERENDER: required
          # Cloudflare Web Analytics (cookieless). Unset: no beacon.
          VITE_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_AUDIT_WORKER_URL: https://rankcli-audit-worker.fly.dev
          # No VITE_AUDIT_WORKER_SECRET: every VITE_ variable ships in the public bundle.
          # Deep audits start through the start-deep-audit edge function instead.
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          VITE_GITHUB_APP_URL: https://github.com/apps/rankcli
        run: pnpm build

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=main --commit-dirty=true
        working-directory: packages/saas

  # ---------------------------------------------------------------------------
  # Deploy Audit Worker to Fly.io
  # ---------------------------------------------------------------------------
  deploy-worker:
    name: Deploy Audit Worker
    runs-on: ubuntu-latest
    needs: [preflight, changes]
    if: |
      needs.preflight.outputs.ready == 'true' && (
        github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_worker == 'true' ||
        github.event_name == 'release' ||
        needs.changes.outputs.worker == 'true'
      )

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Build context is repo root (.) for workspace dependencies
          flyctl deploy . --remote-only --build-arg CACHEBUST=$(date +%s) --no-cache --app rankcli-audit-worker --config packages/audit-worker/fly.toml --dockerfile packages/audit-worker/Dockerfile

      - name: Ensure autoscaling machine pool
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # `fly deploy` never changes how many machines there are; this does.
          # fly.toml has auto_stop_machines off - Fly stopped machines that were
          # running background audits, because it only counts HTTP traffic - so
          # every machine here runs all the time. Two gives redundancy (a deploy
          # or a crash doesn't take audits down) at the cost of two small VMs.
          # Idempotent - a no-op if already at this count.
          flyctl scale count 2 --app rankcli-audit-worker --yes

      - name: Set Fly.io Secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Build secrets command with required secrets
          SECRETS_CMD="flyctl secrets set"
          SECRETS_CMD="$SECRETS_CMD SUPABASE_URL=\"https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co\""
          SECRETS_CMD="$SECRETS_CMD SUPABASE_SERVICE_ROLE_KEY=\"${{ secrets.SUPABASE_SERVICE_KEY }}\""
          SECRETS_CMD="$SECRETS_CMD OPENAI_API_KEY=\"${{ secrets.OPENAI_API_KEY }}\""
          SECRETS_CMD="$SECRETS_CMD WORKER_SECRET=\"${{ secrets.AUDIT_WORKER_SECRET }}\""

          # The public no-signup AI-visibility tool asks each assistant on RankCLI's own key
          # (every signed-in feature uses the user's). An assistant without a key here is
          # shown as "not checked".
          # OpenRouter is the primary bridge - with OPENROUTER_API_KEY set, one key asks all four.
          if [ -n "${{ secrets.OPEN_ROUTER_API_KEY }}" ]; then
            SECRETS_CMD="$SECRETS_CMD OPENROUTER_API_KEY=\"${{ secrets.OPEN_ROUTER_API_KEY }}\""
          fi
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            SECRETS_CMD="$SECRETS_CMD ANTHROPIC_API_KEY=\"${{ secrets.ANTHROPIC_API_KEY }}\""
          fi
          if [ -n "${{ secrets.GOOGLE_API_KEY }}" ]; then
            SECRETS_CMD="$SECRETS_CMD GOOGLE_API_KEY=\"${{ secrets.GOOGLE_API_KEY }}\""
          fi
          if [ -n "${{ secrets.PERPLEXITY_API_KEY }}" ]; then
            SECRETS_CMD="$SECRETS_CMD PERPLEXITY_API_KEY=\"${{ secrets.PERPLEXITY_API_KEY }}\""
          fi

          # Add optional competitive search API keys if configured
          if [ -n "${{ secrets.BRAVE_API_KEY }}" ]; then
            SECRETS_CMD="$SECRETS_CMD BRAVE_API_KEY=\"${{ secrets.BRAVE_API_KEY }}\""
          fi
          if [ -n "${{ secrets.SERPER_API_KEY }}" ]; then
            SECRETS_CMD="$SECRETS_CMD SERPER_API_KEY=\"${{ secrets.SERPER_API_KEY }}\""
          fi
          if [ -n "${{ secrets.GITHUB_TOKEN_SEARCH }}" ]; then
            SECRETS_CMD="$SECRETS_CMD GITHUB_TOKEN=\"${{ secrets.GITHUB_TOKEN_SEARCH }}\""
          fi

          eval "$SECRETS_CMD --app rankcli-audit-worker"

      - name: Verify Deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 10

          # Get machine ID and restart to apply secrets
          MACHINE_ID=$(flyctl machine list --app rankcli-audit-worker --json | jq -r '.[0].id')
          if [ -n "$MACHINE_ID" ] && [ "$MACHINE_ID" != "null" ]; then
            echo "Restarting machine $MACHINE_ID..."
            flyctl machine restart $MACHINE_ID --app rankcli-audit-worker
            sleep 15
          fi

          # Health check with retries
          for i in 1 2 3 4 5; do
            if curl -sf https://rankcli-audit-worker.fly.dev/health; then
              echo "✅ Audit worker is healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "❌ Health check failed after 5 attempts"
          exit 1

  # ---------------------------------------------------------------------------
  # Run Database Migrations & Deploy Edge Functions
  # ---------------------------------------------------------------------------
  migrate:
    name: Database Migrations & Edge Functions
    runs-on: ubuntu-latest
    needs: [preflight, changes]
    if: |
      needs.preflight.outputs.ready == 'true' && (
        github.event_name == 'workflow_dispatch' && (github.event.inputs.run_migrations == 'true' || github.event.inputs.deploy_edge_functions == 'true') ||
        github.event_name == 'release' ||
        needs.changes.outputs.migrations == 'true' ||
        needs.changes.outputs.functions == 'true'
      )

    steps:
      - uses: actions/checkout@v4

      # Migrations and edge-function deploys are two independent things that
      # happen to share this job's setup steps - each gets its own on/off
      # switch (instead of both riding on run_migrations) so an edge-function
      # code change deploys even on a migrations=false run, and vice versa.
      - name: Determine deploy scope
        id: scope
        run: |
          if [ "${{ github.event_name == 'release' || needs.changes.outputs.migrations == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations == 'true') }}" = "true" ]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name == 'release' || needs.changes.outputs.functions == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_edge_functions == 'true') }}" = "true" ]; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: packages/saas
        run: pnpm install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Create Database Backup Note
        if: steps.scope.outputs.migrations == 'true'
        run: |
          echo "Migration timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "Backup: Supabase Pro plan provides automatic Point-in-Time Recovery" >> $GITHUB_STEP_SUMMARY

      - name: Run Database Migrations
        if: steps.scope.outputs.migrations == 'true'
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Set Edge Function Secrets
        if: steps.scope.outputs.functions == 'true'
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Set required secrets
          supabase secrets set \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            AUDIT_WORKER_URL="https://rankcli-audit-worker.fly.dev" \
            AUDIT_WORKER_SECRET="${{ secrets.AUDIT_WORKER_SECRET }}"

          # Set optional secrets if configured
          OPTIONAL_SECRETS=""
          if [ -n "${{ secrets.RESEND_API_KEY }}" ]; then
            OPTIONAL_SECRETS="$OPTIONAL_SECRETS RESEND_API_KEY=\"${{ secrets.RESEND_API_KEY }}\""
          fi
          if [ -n "${{ secrets.BRAVE_API_KEY }}" ]; then
            OPTIONAL_SECRETS="$OPTIONAL_SECRETS BRAVE_API_KEY=\"${{ secrets.BRAVE_API_KEY }}\""
          fi
          if [ -n "${{ secrets.SERPER_API_KEY }}" ]; then
            OPTIONAL_SECRETS="$OPTIONAL_SECRETS SERPER_API_KEY=\"${{ secrets.SERPER_API_KEY }}\""
          fi
          if [ -n "${{ secrets.GITHUB_TOKEN_SEARCH }}" ]; then
            OPTIONAL_SECRETS="$OPTIONAL_SECRETS GITHUB_TOKEN=\"${{ secrets.GITHUB_TOKEN_SEARCH }}\""
          fi
          # GitHub App (auto-fix PRs via github-webhook -> run-audit -> create-seo-pr).
          # Optional here, same as the providers above, so deploys don't break
          # for anyone who hasn't generated these yet - create-seo-pr already
          # degrades gracefully (500 "GitHub App not configured") without them.
          if [ -n "${{ secrets.RANKCLI_GITHUB_APP_ID }}" ]; then
            OPTIONAL_SECRETS="$OPTIONAL_SECRETS GITHUB_APP_ID=\"${{ secrets.RANKCLI_GITHUB_APP_ID }}\""
          fi
          if [ -n "${{ secrets.RANKCLI_GITHUB_APP_PRIVATE_KEY }}" ]; then
            OPTIONAL_SECRETS="$OPTIONAL_SECRETS GITHUB_PRIVATE_KEY=\"${{ secrets.RANKCLI_GITHUB_APP_PRIVATE_KEY }}\""
          fi
          if [ -n "${{ secrets.RANKCLI_GITHUB_APP_WEBHOOK_SECRET }}" ]; then
            OPTIONAL_SECRETS="$OPTIONAL_SECRETS GITHUB_WEBHOOK_SECRET=\"${{ secrets.RANKCLI_GITHUB_APP_WEBHOOK_SECRET }}\""
          fi
          # BYOK AI provider keys (user_ai_keys table) are encrypted at rest with
          # this secret. Free tier auto-fix PRs are fully gated on it existing -
          # we never fall back to our own OpenAI key for free-tier users.
          if [ -n "${{ secrets.AI_KEY_ENCRYPTION_SECRET }}" ]; then
            OPTIONAL_SECRETS="$OPTIONAL_SECRETS AI_KEY_ENCRYPTION_SECRET=\"${{ secrets.AI_KEY_ENCRYPTION_SECRET }}\""
          fi
          # Authenticates the scheduled send-weekly-reports.yml workflow to
          # send-weekly-report - that function already accepts the service
          # role key too, but a dedicated cron secret means the actual
          # service role key never has to leave Supabase's own secrets.
          if [ -n "${{ secrets.CRON_SECRET }}" ]; then
            OPTIONAL_SECRETS="$OPTIONAL_SECRETS CRON_SECRET=\"${{ secrets.CRON_SECRET }}\""
          fi
          # Internal ops Slack notifications (notify-slack) - new signups
          # and new paid subscriptions. Both optional so deploys don't
          # break before SLACK_WEBHOOK_URL is created; notify-slack itself
          # also no-ops gracefully without it.
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            OPTIONAL_SECRETS="$OPTIONAL_SECRETS SLACK_WEBHOOK_URL=\"${{ secrets.SLACK_WEBHOOK_URL }}\""
          fi
          if [ -n "${{ secrets.INTERNAL_WEBHOOK_SECRET }}" ]; then
            OPTIONAL_SECRETS="$OPTIONAL_SECRETS INTERNAL_WEBHOOK_SECRET=\"${{ secrets.INTERNAL_WEBHOOK_SECRET }}\""
          fi
          # /rankcli Slack slash command (slack-commands) - verifies
          # inbound requests are really from Slack via this signing secret.
          # Optional so deploys don't break before the Slack App exists;
          # slack-commands itself rejects every request (401) without it.
          if [ -n "${{ secrets.SLACK_SIGNING_SECRET }}" ]; then
            OPTIONAL_SECRETS="$OPTIONAL_SECRETS SLACK_SIGNING_SECRET=\"${{ secrets.SLACK_SIGNING_SECRET }}\""
          fi
          if [ -n "$OPTIONAL_SECRETS" ]; then
            eval "supabase secrets set $OPTIONAL_SECRETS"
          fi

      - name: Deploy Edge Functions
        if: steps.scope.outputs.functions == 'true'
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Deploy all edge functions
          for fn in supabase/functions/*/; do
            fn_name=$(basename "$fn")
            # Skip shared folder
            if [ "$fn_name" != "_shared" ]; then
              echo "Deploying function: $fn_name"
              supabase functions deploy "$fn_name" --no-verify-jwt
            fi
          done

  # ---------------------------------------------------------------------------
  # Sync Stripe Pricing (when pricing config changes)
  # ---------------------------------------------------------------------------
  sync-stripe:
    name: Sync Stripe Pricing
    runs-on: ubuntu-latest
    needs: [preflight, changes, migrate]
    if: |
      always() && needs.preflight.outputs.ready == 'true' && (
        needs.changes.outputs.pricing == 'true' ||
        github.event.inputs.sync_stripe_pricing == 'true'
      ) && needs.migrate.result != 'failure'

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: packages/saas
        run: pnpm install

      - name: Sync Pricing to Stripe
        working-directory: packages/saas
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          echo "Syncing pricing to Stripe..."
          pnpm seed:pricing:stripe
          echo "✅ Pricing synced to Stripe" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Post-deployment Summary
  # ---------------------------------------------------------------------------
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [preflight, deploy-frontend, deploy-worker, migrate, sync-stripe]
    if: always()

    steps:
      - name: Summary
        run: |
          if [ "${{ needs.preflight.outputs.ready }}" != "true" ]; then
            echo "## ⏭️ Deployment Skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Required secrets are not configured. See the Preflight Check job for details." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result == 'success' && '✅ Deployed' || needs.deploy-frontend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Audit Worker (Fly.io) | ${{ needs.deploy-worker.result == 'success' && '✅ Deployed' || needs.deploy-worker.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations & Edge Functions | ${{ needs.migrate.result == 'success' && '✅ Applied' || needs.migrate.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stripe Pricing Sync | ${{ needs.sync-stripe.result == 'success' && '✅ Synced' || needs.sync-stripe.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://rankcli.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Audit Worker**: https://rankcli-audit-worker.fly.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Edge Functions" >> $GITHUB_STEP_SUMMARY
          echo "- create-checkout" >> $GITHUB_STEP_SUMMARY
          echo "- stripe-webhook" >> $GITHUB_STEP_SUMMARY
