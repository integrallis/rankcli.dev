name: One-off Add MCP DNS Records
on:
  workflow_dispatch:
jobs:
  add-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Add A and AAAA records for mcp.rankcli.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=rankcli.dev" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq -r '.result[0].id')
          echo "Zone ID: $ZONE_ID"

          if [ "$ZONE_ID" = "null" ] || [ -z "$ZONE_ID" ]; then
            echo "Could not resolve zone ID - token likely lacks Zone:Read permission"
            exit 1
          fi

          echo "=== Creating A record ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"type":"A","name":"mcp","content":"66.241.124.140","proxied":false,"ttl":300}'
          echo ""

          echo "=== Creating AAAA record ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"type":"AAAA","name":"mcp","content":"2a09:8280:1::cd:b92b:0","proxied":false,"ttl":300}'
          echo ""
