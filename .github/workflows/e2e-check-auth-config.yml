name: E2E Check Auth Config

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Email confirmation needs working delivery: the built-in Supabase mailer only sends
      # to the project team, so without custom SMTP public email signups never get their
      # confirmation link. SMTP is reported by presence only - never the password.
      - name: Get Supabase auth provider config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_REF="bspljbxwbjiqueeyzyat"
          curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | node -pe '
              const c = JSON.parse(require("fs").readFileSync(0, "utf8"));
              JSON.stringify({
                external_github_enabled: c.external_github_enabled,
                external_github_client_id: c.external_github_client_id,
                external_google_enabled: c.external_google_enabled,
                external_email_enabled: c.external_email_enabled,
                disable_signup: c.disable_signup,
                site_url: c.site_url,
                uri_allow_list: c.uri_allow_list,
                mailer_autoconfirm: c.mailer_autoconfirm,
                smtp_configured: Boolean(c.smtp_host),
                smtp_host: c.smtp_host || null,
                smtp_sender: c.smtp_admin_email || null,
                rate_limit_email_sent: c.rate_limit_email_sent,
              }, null, 2)
            '

      # docs/OUTCOME_PLAN_2026-11.md, Phase 0.1: is the outcome we sell, a merged fix, happening?
      # Aggregates only: this repository is public and so are its run logs, so no repository,
      # PR URL or email is printed. "internal" = PRs on integrallis, integrallis-test and
      # bsbodden repositories or by @integrallis.com accounts. To read individual rejected PRs,
      # run the closed-unmerged query in the plan from the Supabase SQL editor instead.
      # pr_state is kept by the GitHub App webhook, so a PR whose close event never arrived
      # still reads "open".
      - name: Auto-fix PR outcomes (aggregates only, no personal data)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_REF="bspljbxwbjiqueeyzyat"
          query() {
            node -e 'process.stdout.write(JSON.stringify({ query: process.argv[1] }))' "$1" \
              | curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data-binary @-
            echo
          }
          PR="WITH pr AS (SELECT g.pr_state, g.created_at, g.merged_at, p.user_id, (COALESCE(p.github_repo_url, '') ~* '^https://github\.com/(integrallis|integrallis-test|bsbodden)/' OR u.email ILIKE '%@integrallis.com') AS internal FROM github_prs g JOIN projects p ON p.id = g.project_id JOIN auth.users u ON u.id = p.user_id WHERE g.kind = 'auto_fix')"
          OUTCOME="SELECT CASE WHEN internal THEN 'internal' ELSE 'external' END AS who, COUNT(*) AS opened, COUNT(*) FILTER (WHERE pr_state = 'merged') AS merged, COUNT(*) FILTER (WHERE pr_state = 'closed') AS closed_unmerged, COUNT(*) FILTER (WHERE pr_state = 'open') AS still_open, ROUND(100.0 * COUNT(*) FILTER (WHERE pr_state = 'merged') / NULLIF(COUNT(*) FILTER (WHERE pr_state IN ('merged', 'closed')), 0), 1) AS merge_rate_pct, ROUND((percentile_cont(0.5) WITHIN GROUP (ORDER BY EXTRACT(EPOCH FROM merged_at - created_at) / 3600) FILTER (WHERE merged_at IS NOT NULL))::numeric, 1) AS median_hours_to_merge, COUNT(DISTINCT user_id) AS users FROM pr"
          echo "--- auto-fix PR outcomes, all time ---"
          query "$PR $OUTCOME GROUP BY 1 ORDER BY 1"
          echo "--- auto-fix PR outcomes, PRs opened in the last 30 days ---"
          query "$PR $OUTCOME WHERE created_at > now() - interval '30 days' GROUP BY 1 ORDER BY 1"
          echo "--- time to first outcome, external accounts (founder's personal account included) ---"
          query "WITH u AS (SELECT id, created_at FROM auth.users WHERE email NOT ILIKE '%@integrallis.com'), fa AS (SELECT p.user_id, MIN(a.created_at) AS t FROM audits a JOIN projects p ON p.id = a.project_id GROUP BY 1), gh AS (SELECT DISTINCT user_id FROM projects WHERE github_installation_id IS NOT NULL), fp AS (SELECT p.user_id, MIN(g.created_at) AS t, MIN(g.merged_at) AS m FROM github_prs g JOIN projects p ON p.id = g.project_id WHERE g.kind = 'auto_fix' AND NOT (COALESCE(p.github_repo_url, '') ~* '^https://github\.com/(integrallis|integrallis-test|bsbodden)/') GROUP BY 1) SELECT COUNT(*) AS accounts, COUNT(fa.t) AS with_audit, COUNT(gh.user_id) AS with_github_app, COUNT(fp.t) AS with_auto_fix_pr, COUNT(fp.m) AS with_merged_pr, ROUND((percentile_cont(0.5) WITHIN GROUP (ORDER BY EXTRACT(EPOCH FROM fa.t - u.created_at) / 86400) FILTER (WHERE fa.t IS NOT NULL))::numeric, 2) AS median_days_signup_to_audit, ROUND((percentile_cont(0.5) WITHIN GROUP (ORDER BY EXTRACT(EPOCH FROM fp.t - fa.t) / 86400) FILTER (WHERE fp.t IS NOT NULL AND fa.t IS NOT NULL))::numeric, 2) AS median_days_audit_to_pr, ROUND((percentile_cont(0.5) WITHIN GROUP (ORDER BY EXTRACT(EPOCH FROM fp.m - fp.t) / 86400) FILTER (WHERE fp.m IS NOT NULL))::numeric, 2) AS median_days_pr_to_merge FROM u LEFT JOIN fa ON fa.user_id = u.id LEFT JOIN gh ON gh.user_id = u.id LEFT JOIN fp ON fp.user_id = u.id"

      # docs/OUTCOME_PLAN_2026-11.md, item 3.3: the first auto-fix PR on the Free plan runs on
      # RankCLI's own model key (ai_gift_grants); its cost has to stay visible next to the
      # outcome it buys. Aggregates only, for the same reason as above.
      - name: Cost of the free hosted PR (aggregates only, no personal data)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_REF="bspljbxwbjiqueeyzyat"
          query() {
            node -e 'process.stdout.write(JSON.stringify({ query: process.argv[1] }))' "$1" \
              | curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data-binary @-
            echo
          }
          echo "--- free hosted PR grants by status, all time ---"
          query "SELECT status, COUNT(*) AS grants, COUNT(cost_usd) AS with_cost, ROUND(COALESCE(SUM(cost_usd), 0)::numeric, 4) AS total_cost_usd, ROUND(AVG(cost_usd)::numeric, 4) AS avg_cost_usd, ROUND(AVG(prompt_tokens))::int AS avg_prompt_tokens, ROUND(AVG(completion_tokens))::int AS avg_completion_tokens, MAX(cost_usd) AS max_cost_usd FROM ai_gift_grants GROUP BY 1 ORDER BY 1"
          echo "--- free hosted PR cost per month (settled grants) ---"
          query "SELECT date_trunc('month', granted_at)::date AS month, COUNT(*) AS settled, ROUND(SUM(cost_usd)::numeric, 4) AS total_cost_usd, ROUND(AVG(cost_usd)::numeric, 4) AS avg_cost_usd, COALESCE(model, 'unknown') AS model FROM ai_gift_grants WHERE status = 'settled' GROUP BY 1, 5 ORDER BY 1, 5"
          echo "--- what the gift bought: settled grants whose PR was merged, closed or is still open ---"
          query "WITH g AS (SELECT a.user_id, a.cost_usd, a.granted_at FROM ai_gift_grants a WHERE a.status = 'settled'), pr AS (SELECT p.user_id, gp.pr_state, gp.created_at FROM github_prs gp JOIN projects p ON p.id = gp.project_id WHERE gp.kind = 'auto_fix') SELECT COUNT(*) AS settled_grants, COUNT(*) FILTER (WHERE EXISTS (SELECT 1 FROM pr WHERE pr.user_id = g.user_id AND pr.pr_state = 'merged')) AS with_merged_pr, COUNT(*) FILTER (WHERE EXISTS (SELECT 1 FROM pr WHERE pr.user_id = g.user_id AND pr.pr_state = 'closed') AND NOT EXISTS (SELECT 1 FROM pr WHERE pr.user_id = g.user_id AND pr.pr_state = 'merged')) AS with_closed_only, ROUND(SUM(g.cost_usd)::numeric, 4) AS total_cost_usd, ROUND((SUM(g.cost_usd) / NULLIF(COUNT(*) FILTER (WHERE EXISTS (SELECT 1 FROM pr WHERE pr.user_id = g.user_id AND pr.pr_state = 'merged')), 0))::numeric, 4) AS cost_per_merged_pr_usd FROM g"

      - name: Signup funnel (aggregates only, no personal data)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_REF="bspljbxwbjiqueeyzyat"
          query() {
            node -e 'process.stdout.write(JSON.stringify({ query: process.argv[1] }))' "$1" \
              | curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data-binary @-
            echo
          }
          echo "--- accounts per week (confirmed = email confirmed or OAuth) ---"
          query "SELECT date_trunc('week', created_at)::date AS week, COUNT(*) AS signups, COUNT(*) FILTER (WHERE email_confirmed_at IS NOT NULL) AS confirmed, COUNT(*) FILTER (WHERE last_sign_in_at IS NOT NULL) AS ever_signed_in FROM auth.users GROUP BY 1 ORDER BY 1"
          echo "--- sign-up method ---"
          query "SELECT COALESCE(raw_app_meta_data->>'provider', 'unknown') AS provider, COUNT(*) AS users, COUNT(*) FILTER (WHERE email_confirmed_at IS NULL) AS unconfirmed FROM auth.users GROUP BY 1 ORDER BY 2 DESC"
          echo "--- anonymous free audits per week ---"
          query "SELECT date_trunc('week', created_at)::date AS week, COUNT(*) AS free_audits, COUNT(*) FILTER (WHERE email IS NOT NULL) AS with_email, COUNT(*) FILTER (WHERE converted_to_signup) AS converted FROM free_audits GROUP BY 1 ORDER BY 1"
          echo "--- AI visibility checks per week ---"
          query "SELECT date_trunc('week', created_at)::date AS week, COUNT(*) AS checks FROM ai_visibility_checks GROUP BY 1 ORDER BY 1"

      # docs/OUTCOME_PLAN_2026-11.md, item 4.6: an ad is judged on GitHub App installs, not on
      # clicks, so installs are counted by the source the account recorded at its first visit
      # (profiles.signup_source, written once by the site). Aggregates only.
      - name: Accounts and GitHub App installs by source (aggregates only, no personal data)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_REF="bspljbxwbjiqueeyzyat"
          query() {
            node -e 'process.stdout.write(JSON.stringify({ query: process.argv[1] }))' "$1" \
              | curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data-binary @-
            echo
          }
          echo "--- accounts, audits and GitHub App installs by source (accounts created in the last 90 days) ---"
          query "WITH acc AS (SELECT pr.id, pr.created_at, COALESCE(pr.signup_source->>'utm_source', CASE WHEN pr.signup_source->>'referrer' IS NOT NULL THEN 'ref:' || (pr.signup_source->>'referrer') ELSE 'direct/unknown' END) AS source, COALESCE(pr.signup_source->>'utm_campaign', '') AS campaign, COALESCE(pr.signup_source->>'landing_path', '') AS landing FROM profiles pr WHERE pr.created_at > now() - interval '90 days'), au AS (SELECT DISTINCT p.user_id FROM audits a JOIN projects p ON p.id = a.project_id), gh AS (SELECT DISTINCT user_id FROM projects WHERE github_installation_id IS NOT NULL), fp AS (SELECT DISTINCT p.user_id FROM github_prs g JOIN projects p ON p.id = g.project_id WHERE g.kind = 'auto_fix') SELECT acc.source, acc.campaign, COUNT(*) AS accounts, COUNT(au.user_id) AS with_audit, COUNT(gh.user_id) AS with_github_app, COUNT(fp.user_id) AS with_auto_fix_pr FROM acc LEFT JOIN au ON au.user_id = acc.id LEFT JOIN gh ON gh.user_id = acc.id LEFT JOIN fp ON fp.user_id = acc.id GROUP BY 1, 2 ORDER BY 3 DESC, 1"
          echo "--- landing paths of accounts with a recorded source ---"
          query "SELECT COALESCE(signup_source->>'landing_path', '') AS landing, COUNT(*) AS accounts FROM profiles WHERE signup_source IS NOT NULL GROUP BY 1 ORDER BY 2 DESC LIMIT 20"

      - name: Billing integrity (aggregates only, no personal data)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_REF="bspljbxwbjiqueeyzyat"
          query() {
            node -e 'process.stdout.write(JSON.stringify({ query: process.argv[1] }))' "$1" \
              | curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data-binary @-
            echo
          }
          echo "--- paying subscriptions with no plan (the old webhook bug) ---"
          query "SELECT COUNT(*) AS stranded FROM user_subscriptions WHERE stripe_subscription_id IS NOT NULL AND plan_id IS NULL"
          echo "--- effective plan per user (effective_entitlement) ---"
          query "SELECT e.tier, e.source, e.sites_limit, COUNT(*) AS users FROM auth.users u CROSS JOIN LATERAL effective_entitlement(u.id) e GROUP BY 1,2,3 ORDER BY 1"
          echo "--- lifetime deals ---"
          query "SELECT (SELECT COUNT(*) FROM ltd_purchases) AS purchases, (SELECT COUNT(*) FROM ltd_reservations WHERE NOT converted_to_purchase) AS open_reservations"
          echo "--- users over their site limit (left alone by the trigger; downgrades) ---"
          query "SELECT COUNT(*) AS over_limit FROM auth.users u CROSS JOIN LATERAL effective_entitlement(u.id) e WHERE (SELECT COUNT(*) FROM projects p WHERE p.user_id = u.id AND p.is_active) > e.sites_limit"

      - name: Alerts pipeline (aggregates; no alert is sent when no configs exist)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AUDIT_WORKER_SECRET: ${{ secrets.AUDIT_WORKER_SECRET }}
        run: |
          set -euo pipefail
          PROJECT_REF="bspljbxwbjiqueeyzyat"
          query() {
            node -e 'process.stdout.write(JSON.stringify({ query: process.argv[1] }))' "$1" \
              | curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data-binary @-
            echo
          }
          echo "--- alert configs ---"
          CONFIGS=$(query "SELECT COUNT(*) AS n FROM alert_configs WHERE enabled")
          echo "$CONFIGS"
          echo "--- project-alerts on the latest finished audit ---"
          AUDIT=$(query "SELECT id FROM audits WHERE status IN ('completed','failed') ORDER BY created_at DESC LIMIT 1" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8"))[0]?.id || ""')
          if echo "$CONFIGS" | grep -q '"n":0'; then
            curl -s -X POST "https://$PROJECT_REF.supabase.co/functions/v1/project-alerts" \
              -H "Authorization: Bearer $AUDIT_WORKER_SECRET" -H "Content-Type: application/json" \
              -d "{\"auditId\":\"$AUDIT\"}"
            echo
          else
            echo "alert configs exist - not calling, so no real alert is sent from a diagnostic"
          fi

      - name: Scheduled audits (aggregates; hostnames only for localhost-style URLs)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_REF="bspljbxwbjiqueeyzyat"
          query() {
            node -e 'process.stdout.write(JSON.stringify({ query: process.argv[1] }))' "$1" \
              | curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data-binary @-
            echo
          }
          echo "--- scheduled audits in the last 6 hours ---"
          query "SELECT status, COUNT(*) AS n, ROUND(AVG(score)) AS avg_score, MIN(error_message) AS sample_error FROM audits WHERE triggered_by = 'scheduled' AND created_at > NOW() - INTERVAL '6 hours' GROUP BY status"
          echo "--- scheduled audit history ---"
          query "SELECT to_char(created_at, 'HH24:MI:SS') AS created, status, left(coalesce(error_message, ''), 40) AS error FROM audits WHERE triggered_by = 'scheduled' ORDER BY created_at"
          echo "--- recent audit errors (full text) ---"
          query "SELECT to_char(created_at, 'HH24:MI:SS') AS created, error_message FROM audits WHERE status = 'failed' AND created_at > NOW() - INTERVAL '2 hours' AND error_message NOT LIKE 'Audit interrupted%' ORDER BY created_at"
          echo "--- db now ---"
          query "SELECT to_char(NOW(), 'HH24:MI:SS') AS now"
          echo "--- unfinished audits (age) ---"
          query "SELECT status, triggered_by, NOW() - created_at AS age FROM audits WHERE status IN ('pending','running') ORDER BY created_at"
          echo "--- active projects whose URL is not a public host ---"
          query "SELECT COUNT(*) AS n, array_agg(DISTINCT split_part(split_part(url, '://', 2), '/', 1)) FILTER (WHERE url ~* '://(localhost|127\\.|0\\.0\\.0\\.0|10\\.|192\\.168\\.)') AS hosts FROM projects WHERE is_active AND url ~* '://(localhost|127\\.|0\\.0\\.0\\.0|10\\.|192\\.168\\.)'"
          # Columns the CLI's rank tracking (rankcli track) reads and writes.
          echo "--- rank tracking schema ---"
          query "SELECT table_name, string_agg(column_name, ', ' ORDER BY ordinal_position) AS columns FROM information_schema.columns WHERE table_schema = 'public' AND table_name IN ('keywords', 'rankings', 'keyword_rankings', 'keyword_ranking_history') GROUP BY table_name"
          query "SELECT column_name FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'projects' AND column_name IN ('domain', 'last_rank_check_at')"
          query "SELECT (SELECT COUNT(*) FROM keywords) AS keywords, (SELECT COUNT(*) FROM keyword_rankings) AS keyword_rankings"
          # Search Console integration (gsc-oauth, sync-gsc-metrics): tables, rows, and a users table if any.
          echo "--- edge function secret NAMES (never values) ---"
          curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -c '[.[].name] | sort'
          echo "--- founder checklist status ---"
          query "SELECT status, COUNT(*) AS n, MAX(created_at)::text AS latest FROM audits WHERE triggered_by = 'manual' AND created_at > NOW() - INTERVAL '7 days' GROUP BY status"
          curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -c '[.[].name] as $n | {google_oauth: (($n | index("GOOGLE_CLIENT_ID")) != null and ($n | index("GOOGLE_CLIENT_SECRET")) != null), github_app_oauth: (($n | index("GITHUB_APP_CLIENT_ID")) != null and ($n | index("GITHUB_APP_CLIENT_SECRET")) != null)}'
          query "SELECT (SELECT COUNT(*) FROM oauth_connections WHERE provider = 'google') AS gsc_connections, (SELECT COUNT(*) FROM seo_metrics WHERE source = 'gsc') AS gsc_metric_rows"
          echo "--- search console schema ---"
          query "SELECT table_name, string_agg(column_name || ':' || data_type, ', ' ORDER BY ordinal_position) AS columns FROM information_schema.columns WHERE table_schema = 'public' AND table_name IN ('oauth_connections', 'seo_metrics', 'sync_jobs', 'users') GROUP BY table_name"
          query "SELECT conrelid::regclass AS tbl, conname, pg_get_constraintdef(oid) AS def FROM pg_constraint WHERE conrelid::regclass::text IN ('oauth_connections', 'seo_metrics', 'keyword_rankings', 'sync_jobs') AND contype IN ('u', 'c')"
          query "SELECT (SELECT COUNT(*) FROM oauth_connections) AS oauth_connections, (SELECT COUNT(*) FROM seo_metrics) AS seo_metrics"
