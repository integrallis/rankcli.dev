name: E2E Check Audit Worker

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call audit-worker directly for animerm.ai
        env:
          AUDIT_WORKER_SECRET: ${{ secrets.AUDIT_WORKER_SECRET }}
        run: |
          set -euo pipefail
          curl -s -X POST "https://rankcli-audit-worker.fly.dev/audit/quick" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $AUDIT_WORKER_SECRET" \
            -d '{"url":"https://animerm.ai","maxPages":1,"checksLimit":280,"enableAI":false}' \
            | node -pe '
              const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
              const fw = (d.issues||[]).filter(i => i.details && i.details.framework);
              JSON.stringify({ score: d.score, totalIssues: d.issues?.length, frameworkIssueCodes: fw.map(i=>i.code) }, null, 2)
            '
