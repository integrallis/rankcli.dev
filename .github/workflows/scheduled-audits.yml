name: Scheduled Audits

# Runs each plan's automatic audits (Free and Solo weekly, Pro and Agency daily) - see
# packages/saas/supabase/functions/run-scheduled-audits. Hourly, so a project is audited
# within an hour of becoming due; a run only dispatches projects whose cadence has elapsed.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List due projects without starting audits'
        type: boolean
        default: false
      stuck_after_minutes:
        description: 'Treat unfinished audits older than this as dead (after a worker restart); default 60'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call run-scheduled-audits
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          STUCK_AFTER: ${{ github.event.inputs.stuck_after_minutes || '' }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo "CRON_SECRET is not set"; exit 1; }
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/functions/v1/run-scheduled-audits?dry_run=$DRY_RUN&stuck_after_minutes=$STUCK_AFTER" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
