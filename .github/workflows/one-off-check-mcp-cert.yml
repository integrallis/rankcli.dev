name: One-off Check MCP Cert Status
on:
  workflow_dispatch:
jobs:
  check-cert:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check cert status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl certs show mcp.rankcli.dev -a rankcli-audit-worker
