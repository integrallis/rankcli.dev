name: One-off Add Google Search Console Verification TXT
on:
  workflow_dispatch:
jobs:
  add-txt:
    runs-on: ubuntu-latest
    steps:
      - name: Add GSC verification TXT record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=rankcli.dev" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id')
          echo "Zone ID: $ZONE_ID"
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"type":"TXT","name":"rankcli.dev","content":"google-site-verification=tdCNQoEkOlhPRJ0nOnLBdfdzAJv5WKU2DK8BFvz3Gjs","ttl":300}' | jq '.'
