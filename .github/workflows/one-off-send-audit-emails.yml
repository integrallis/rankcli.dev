name: One-off - send audit complete emails for reran audits

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send audit-complete emails
        env:
          SUPABASE_URL: ${{ secrets.RANKCLI_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WORKER_SECRET: ${{ secrets.AUDIT_WORKER_SECRET }}
        run: |
          echo "--- attempt with service role key ---"
          curl -sS -w '\nHTTP %{http_code}\n' -X POST "$SUPABASE_URL/functions/v1/send-audit-email" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"auditId":"0cba3bfe-a6c3-4b69-9a0e-ec21ce058b85"}'
          echo
          echo "--- attempt with worker secret ---"
          curl -sS -w '\nHTTP %{http_code}\n' -X POST "$SUPABASE_URL/functions/v1/send-audit-email" \
            -H "Authorization: Bearer $WORKER_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"auditId":"0cba3bfe-a6c3-4b69-9a0e-ec21ce058b85"}'
