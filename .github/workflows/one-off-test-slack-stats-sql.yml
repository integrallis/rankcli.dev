name: One-off - test slack admin stats SQL

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Call rankcli_admin_user_stats()
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db query "SELECT rankcli_admin_user_stats();" --linked

      - name: Sanity-check billing query shape
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT us.status, sp.plan_id, sp.name, sp.price_cents, sp.billing_period
            FROM user_subscriptions us
            LEFT JOIN subscription_plans sp ON sp.id = us.plan_id
            WHERE us.status IN ('active','trialing','lifetime')
            LIMIT 20;
          " --linked

      - name: Confirm grants (service_role only)
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT grantee, privilege_type
            FROM information_schema.routine_privileges
            WHERE routine_name = 'rankcli_admin_user_stats';
          " --linked
