name: One-off Check MCP DNS Records
on:
  workflow_dispatch:
jobs:
  check-dns:
    runs-on: ubuntu-latest
    steps:
      - name: List DNS records and zone settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=rankcli.dev" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq -r '.result[0].id')
          echo "Zone ID: $ZONE_ID"

          echo "=== All DNS records matching mcp ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=mcp.rankcli.dev" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq '.'

          echo "=== DNSSEC status ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dnssec" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq '.result.status'

          echo "=== Zone details (paused? plan?) ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq '.result | {paused, status, plan: .plan.name}'
