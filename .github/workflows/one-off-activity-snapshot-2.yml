name: One-off - activity snapshot 2026-09-12

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Users + activity
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db query "SELECT rankcli_admin_user_stats();" --linked

      - name: New signups (last 5 days)
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT email, created_at, last_sign_in_at
            FROM auth.users
            WHERE created_at >= NOW() - INTERVAL '5 days'
            ORDER BY created_at DESC;
          " --linked

      - name: Subscriptions by plan
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT sp.name AS plan, us.status, COUNT(*)
            FROM user_subscriptions us
            LEFT JOIN subscription_plans sp ON sp.id = us.plan_id
            WHERE us.status IN ('active','trialing','lifetime')
            GROUP BY sp.name, us.status
            ORDER BY 3 DESC;
          " --linked

      - name: Projects
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT COUNT(*) AS total_projects,
                   COUNT(*) FILTER (WHERE github_repo_id IS NOT NULL) AS github_connected,
                   COUNT(*) FILTER (WHERE created_at >= NOW() - INTERVAL '5 days') AS new_5d
            FROM projects;
          " --linked

      - name: Audits status + any new failures
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT status, COUNT(*), ROUND(AVG(score)) AS avg_score,
                   COUNT(*) FILTER (WHERE created_at >= NOW() - INTERVAL '5 days') AS last_5d
            FROM audits
            GROUP BY status
            ORDER BY 2 DESC;
          " --linked
          echo "--- failed audits detail (excluding known Feb ones) ---"
          supabase db query "
            SELECT a.id, p.domain, a.created_at, a.summary
            FROM audits a JOIN projects p ON p.id = a.project_id
            WHERE a.status = 'failed' AND a.created_at >= '2026-09-01'
            ORDER BY a.created_at DESC;
          " --linked

      - name: Free audits + email capture check
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT COUNT(*) AS total,
                   COUNT(*) FILTER (WHERE created_at >= NOW() - INTERVAL '5 days') AS last_5d,
                   COUNT(*) FILTER (WHERE email IS NOT NULL) AS with_email,
                   COUNT(*) FILTER (WHERE email IS NOT NULL AND created_at >= NOW() - INTERVAL '5 days') AS with_email_last_5d,
                   COUNT(*) FILTER (WHERE converted_to_signup) AS converted,
                   COUNT(*) FILTER (WHERE followup_sent_at IS NOT NULL) AS followup_sent,
                   COUNT(*) FILTER (WHERE followup_opted_out) AS followup_opted_out
            FROM free_audits;
          " --linked
          echo "--- recent free audits with email ---"
          supabase db query "
            SELECT domain, score, email, converted_to_signup, followup_sent_at, created_at
            FROM free_audits
            WHERE email IS NOT NULL
            ORDER BY created_at DESC
            LIMIT 20;
          " --linked

      - name: Auto-fix PRs
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT pr_state, COUNT(*),
                   COUNT(*) FILTER (WHERE created_at >= NOW() - INTERVAL '5 days') AS last_5d
            FROM github_prs
            GROUP BY pr_state;
          " --linked

      - name: CLI/API activity (last 5 days)
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT COUNT(*) AS total_requests,
                   COUNT(DISTINCT user_id) AS distinct_users,
                   COUNT(DISTINCT api_key_id) AS distinct_keys
            FROM api_requests
            WHERE created_at >= NOW() - INTERVAL '5 days';
          " --linked
