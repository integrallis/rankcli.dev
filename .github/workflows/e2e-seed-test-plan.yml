name: E2E Seed Test Subscription

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'auth.users.id of the e2e test user'
        required: true
      plan_id:
        description: "subscription_plans.plan_id text ('solo'/'pro'/'agency')"
        required: true
        default: 'solo'

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Insert a simulated active subscription for the test user
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          SUPABASE_URL="https://bspljbxwbjiqueeyzyat.supabase.co"
          USER_ID="${{ inputs.user_id }}"
          PLAN_ID_TEXT="${{ inputs.plan_id }}"

          PLAN_ROW=$(curl -s "$SUPABASE_URL/rest/v1/subscription_plans?plan_id=eq.$PLAN_ID_TEXT&select=id" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY")
          PLAN_UUID=$(node -pe 'JSON.parse(process.argv[1])[0].id' "$PLAN_ROW")
          echo "Resolved plan '$PLAN_ID_TEXT' -> $PLAN_UUID"

          RESP=$(curl -s -w "\n%{http_code}" -X PATCH "$SUPABASE_URL/rest/v1/user_subscriptions?user_id=eq.$USER_ID" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"plan_id\":\"$PLAN_UUID\",\"status\":\"active\",\"current_period_start\":\"$(date -u +%FT%TZ)\",\"current_period_end\":\"$(date -u -d '+30 days' +%FT%TZ)\"}")

          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n1)
          echo "HTTP $CODE"
          echo "$BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::Failed to seed subscription"
            exit 1
          fi
          echo "Seeded active '$PLAN_ID_TEXT' subscription for user $USER_ID"
