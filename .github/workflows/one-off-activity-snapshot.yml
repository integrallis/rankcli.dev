name: One-off - activity snapshot

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Users + activity
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db query "SELECT rankcli_admin_user_stats();" --linked

      - name: Subscriptions by plan
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT sp.name AS plan, us.status, COUNT(*)
            FROM user_subscriptions us
            LEFT JOIN subscription_plans sp ON sp.id = us.plan_id
            WHERE us.status IN ('active','trialing','lifetime')
            GROUP BY sp.name, us.status
            ORDER BY 3 DESC;
          " --linked

      - name: Projects (connected sites)
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT COUNT(*) AS total_projects,
                   COUNT(*) FILTER (WHERE github_repo_id IS NOT NULL) AS github_connected,
                   COUNT(*) FILTER (WHERE created_at >= NOW() - INTERVAL '7 days') AS new_7d
            FROM projects;
          " --linked

      - name: Audits (paid, connected-site)
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT status, COUNT(*), ROUND(AVG(score)) AS avg_score,
                   COUNT(*) FILTER (WHERE created_at >= NOW() - INTERVAL '7 days') AS last_7d
            FROM audits
            GROUP BY status
            ORDER BY 2 DESC;
          " --linked

      - name: Free audits (anonymous, top-of-funnel)
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT COUNT(*) AS total,
                   COUNT(*) FILTER (WHERE created_at >= NOW() - INTERVAL '7 days') AS last_7d,
                   COUNT(*) FILTER (WHERE created_at >= NOW() - INTERVAL '24 hours') AS last_24h,
                   COUNT(*) FILTER (WHERE email IS NOT NULL) AS with_email,
                   COUNT(*) FILTER (WHERE converted_to_signup) AS converted,
                   COUNT(*) FILTER (WHERE followup_sent_at IS NOT NULL) AS followup_sent,
                   COUNT(*) FILTER (WHERE followup_opted_out) AS followup_opted_out
            FROM free_audits;
          " --linked

      - name: Recent free audits (last 20)
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT domain, score, email IS NOT NULL AS has_email, converted_to_signup, created_at
            FROM free_audits
            ORDER BY created_at DESC
            LIMIT 20;
          " --linked

      - name: Auto-fix PRs
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT pr_state, COUNT(*),
                   COUNT(*) FILTER (WHERE created_at >= NOW() - INTERVAL '7 days') AS last_7d
            FROM github_prs
            GROUP BY pr_state;
          " --linked

      - name: CLI/API activity (last 7 days)
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query "
            SELECT COUNT(*) AS total_requests,
                   COUNT(DISTINCT user_id) AS distinct_users,
                   COUNT(DISTINCT api_key_id) AS distinct_keys
            FROM api_requests
            WHERE created_at >= NOW() - INTERVAL '7 days';
          " --linked
