name: Smoke Test GitHub Webhook

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send signed installation webhook and verify
        env:
          WEBHOOK_SECRET: ${{ secrets.RANKCLI_GITHUB_APP_WEBHOOK_SECRET }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          SUPABASE_URL="https://bspljbxwbjiqueeyzyat.supabase.co"
          WEBHOOK_URL="$SUPABASE_URL/functions/v1/github-webhook"
          TEST_ID=999900001

          PAYLOAD='{"action":"created","installation":{"id":'"$TEST_ID"',"account":{"login":"rankcli-e2e-smoketest","type":"User"},"permissions":{"contents":"write"}},"sender":{"login":"rankcli-e2e-smoketest"}}'

          SIG="sha256=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')"

          echo "POSTing signed installation event to $WEBHOOK_URL ..."
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: installation" \
            -H "X-Hub-Signature-256: $SIG" \
            --data-raw "$PAYLOAD")

          echo "HTTP status: $HTTP_CODE"
          cat /tmp/resp.json
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Webhook did not return 200"
            exit 1
          fi

          echo "Verifying github_installations row was written..."
          ROW=$(curl -s "$SUPABASE_URL/rest/v1/github_installations?installation_id=eq.$TEST_ID" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY")
          echo "$ROW"

          if ! echo "$ROW" | grep -q "rankcli-e2e-smoketest"; then
            echo "::error::No matching github_installations row found"
            exit 1
          fi

          echo "Cleaning up test row..."
          curl -s -o /dev/null -w "delete status: %{http_code}\n" -X DELETE \
            "$SUPABASE_URL/rest/v1/github_installations?installation_id=eq.$TEST_ID" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY"

          echo "Webhook smoke test PASSED"
