name: Update Threat Hashes

on:
  # Run every Sunday at 3:00 AM UTC
  schedule:
    - cron: '0 3 * * 0'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-threat-hashes:
    name: Update URLhaus Threat Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate threat hash seed
        id: generate
        run: |
          cd packages/saas
          npx tsx scripts/generate-threat-seed.ts

          # Check if file changed
          if git diff --quiet supabase/migrations/015_threat_hashes_seed.sql; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in threat hashes"
          else
            echo "changed=true" >> $GITHUB_OUTPUT

            # Get stats
            HASH_COUNT=$(grep -c "^  ('" supabase/migrations/015_threat_hashes_seed.sql || echo "0")
            echo "hash_count=$HASH_COUNT" >> $GITHUB_OUTPUT
            echo "Updated with $HASH_COUNT threat hashes"
          fi

      - name: Commit changes
        if: steps.generate.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add packages/saas/supabase/migrations/015_threat_hashes_seed.sql
          git commit -m "chore(security): update threat hashes from URLhaus

          - Updated ${{ steps.generate.outputs.hash_count }} threat hashes
          - Source: URLhaus (abuse.ch)
          - Auto-generated by GitHub Actions

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      - name: Push changes
        if: steps.generate.outputs.changed == 'true'
        run: git push

      - name: Setup Supabase CLI
        if: steps.generate.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy to Supabase
        if: steps.generate.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          cd packages/saas

          # Link to project
          supabase link --project-ref $SUPABASE_PROJECT_ID

          # Run only the threat hashes seed migration
          supabase db push --include-seed

          echo "✅ Threat hashes deployed to Supabase"

      - name: Call sync function (optional refresh)
        if: steps.generate.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # sync-threat-hashes accepts the service role key or CRON_SECRET;
          # the cron secret keeps the service role key inside Supabase.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Optionally call the sync function to refresh from live URLhaus API
          # This ensures we have the absolute latest data
          curl -s -X POST "$SUPABASE_URL/functions/v1/sync-threat-hashes" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" || true

          echo "✅ Sync function called"

      - name: Summary
        run: |
          if [ "${{ steps.generate.outputs.changed }}" == "true" ]; then
            echo "## 🛡️ Threat Hash Update" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Hashes Updated:** ${{ steps.generate.outputs.hash_count }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Source:** URLhaus (abuse.ch)" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** ✅ Deployed to Supabase" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🛡️ Threat Hash Update" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No changes detected in threat hashes. Database is up to date." >> $GITHUB_STEP_SUMMARY
          fi
