name: Publish framework plugins

# Publishes astro-rankcli, vite-plugin-rankcli and next-rankcli to npm through
# Trusted Publishing (OIDC), the same way build-cli.yml publishes the CLI. Manual
# only. A version that is already on npm is skipped, so re-running is safe.
#
# Why OIDC and not a token: on 2026-10-13 a publish with a granular token that
# bypasses 2FA did not publish 0.0.1; npm staged it and put a 0.0.0-stage stub
# on the registry, because direct token publishing is being retired (gone in
# January 2027). Trusted Publishing is not affected. Each package has to be
# linked to this workflow once, by a human with 2FA:
#   npx npm@latest trust github <package> --file publish-plugins.yml \
#     --repo integrallis/rankcli.dev --allow-publish
# or npmjs.com -> package -> Settings -> Trusted Publisher.
# Until that link exists the publish step falls back to the NPM_TOKEN secret
# (a granular token with read/write on all packages and 2FA bypass) and says
# so with a warning; once all three are linked the secret can be deleted.
#
# "diagnose" needs the NPM_TOKEN secret and only reads: whoami, versions,
# staged versions and trust links, so a stuck publish can be understood.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package
        type: choice
        options:
          - all
          - astro-rankcli
          - vite-plugin-rankcli
          - next-rankcli
        default: all
      mode:
        description: publish (Trusted Publishing), dry-run (build, test, pack), diagnose (read-only, uses NPM_TOKEN)
        type: choice
        options:
          - publish
          - dry-run
          - diagnose
        default: publish

env:

jobs:
  plugins:
    name: ${{ inputs.mode }} ${{ inputs.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing; no token involved in publish mode

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (Trusted Publishing needs npm >= 11.5.1; stage/trust commands >= 11.15)
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: pnpm install

      - name: Resolve packages
        id: pkgs
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$PACKAGE" = all ]; then
            echo "names=astro-rankcli vite-plugin-rankcli next-rankcli" >> "$GITHUB_OUTPUT"
          else
            echo "names=$PACKAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, test and publish
        if: inputs.mode != 'diagnose'
        env:
          NAMES: ${{ steps.pkgs.outputs.names }}
          DRY_RUN: ${{ inputs.mode == 'dry-run' }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # fallback only, until each package is linked to Trusted Publishing
        run: |
          set -euo pipefail
          declare -A DIRS=(
            [astro-rankcli]=astro-plugin
            [vite-plugin-rankcli]=vite-plugin
            [next-rankcli]=next-plugin
          )
          failed=0
          for name in $NAMES; do
            dir="packages/${DIRS[$name]}"
            version=$(node -p "require('./$dir/package.json').version")
            echo "::group::$name@$version"
            (cd "$dir" && pnpm build && pnpm test)
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
            elif [ "$DRY_RUN" = true ]; then
              (cd "$dir" && npm pack --dry-run)
            elif (cd "$dir" && npm publish --access public --ignore-scripts); then
              echo "published $name@$version (Trusted Publishing)"
            elif [ -n "${NPM_TOKEN:-}" ] && (cd "$dir" && NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public --ignore-scripts); then
              echo "published $name@$version with NPM_TOKEN"
              echo "::warning::$name is not linked to Trusted Publishing, so this used the token, which npm retires in January 2027. A maintainer with 2FA links it once: npx npm@latest trust github $name --file publish-plugins.yml --repo integrallis/rankcli.dev --allow-publish (or npmjs.com -> $name -> Settings -> Trusted Publisher)."
            else
              failed=1
              echo "::error::$name@$version was not published. Trusted Publishing is not linked and no working NPM_TOKEN exists. A maintainer with 2FA runs:"
              echo "::error::  npx npm@latest trust github $name --file publish-plugins.yml --repo integrallis/rankcli.dev --allow-publish"
              echo "::error::or: npmjs.com -> $name -> Settings -> Trusted Publisher -> GitHub Actions (integrallis / rankcli.dev / publish-plugins.yml). If npm said the version is staged: npx npm@latest stage list $name"
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Diagnose (read-only)
        if: inputs.mode == 'diagnose'
        env:
          NAMES: ${{ steps.pkgs.outputs.names }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          echo "whoami: $(npm whoami 2>/dev/null || echo 'REJECTED')"
          for name in $NAMES; do
            echo "::group::$name"
            echo "-- versions / dist-tags on the registry"
            npm view "$name" versions dist-tags 2>&1 | grep -v '^npm notice' || true
            echo "-- staged versions"
            npm stage list "$name" 2>&1 | grep -v '^npm notice' || true
            echo "-- trusted publishers"
            npm trust list "$name" 2>&1 | grep -v '^npm notice' || true
            echo "::endgroup::"
          done
