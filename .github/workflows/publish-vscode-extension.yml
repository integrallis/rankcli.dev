# =============================================================================
# Publish VS Code Extension (VS Code Marketplace + Open VSX via Trusted Publishing)
# =============================================================================
# Packages Integrallis.rankcli-vscode as a .vsix after running typecheck, tests,
# and esbuild, uploads the .vsix artifact, and publishes to:
# - Visual Studio Marketplace via OIDC Trusted Publishing (`--oidc`, no PAT)
# - Open VSX via OIDC Trusted Publishing (or `OVSX_PAT` for the initial v0.1.0 publish)
#
# One-time Trusted Publishing setup (see docs/FOUNDER_CHECKLIST.md §10):
# - VS Marketplace: publisher Integrallis -> Trusted Publishing -> GitHub Actions
#     owner: integrallis, repo: rankcli.dev, workflow: publish-vscode-extension.yml
# - Open VSX: after the first publish with OVSX_PAT, add Trusted Publisher in
#     Settings -> Trusted Publishers for integrallis/rankcli.dev (publish-vscode-extension.yml)
#     and delete the OVSX_PAT secret.

name: Publish VS Code Extension

on:
  push:
    tags:
      - 'vscode-v*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish to Visual Studio Marketplace (OIDC Trusted Publishing)'
        type: boolean
        default: true
      publish_openvsx:
        description: 'Publish to Open VSX Registry (OIDC Trusted Publishing or OVSX_PAT)'
        type: boolean
        default: true
      dry_run:
        description: 'Package .vsix and upload artifact only (skip publishing)'
        type: boolean
        default: false

env:
  NODE_VERSION: '20'

jobs:
  build-and-publish:
    name: Build, Test & Publish Extension
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check extension
        working-directory: packages/vscode-extension
        run: pnpm typecheck

      - name: Run extension tests
        working-directory: packages/vscode-extension
        run: pnpm test

      - name: Build and package .vsix
        id: package
        working-directory: packages/vscode-extension
        run: |
          pnpm build
          pnpm package
          VSIX_FILE=$(ls -1 *.vsix | head -n 1)
          echo "vsix=$VSIX_FILE" >> "$GITHUB_OUTPUT"
          echo "Packaged: $VSIX_FILE"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: rankcli-vscode-vsix
          path: packages/vscode-extension/${{ steps.package.outputs.vsix }}

      - name: Publish to Visual Studio Marketplace (OIDC)
        id: marketplace
        if: inputs.dry_run != true && (github.event_name == 'push' || inputs.publish_marketplace == true)
        working-directory: packages/vscode-extension
        run: |
          npx -y @vscode/vsce@latest publish --packagePath "${{ steps.package.outputs.vsix }}" --oidc
          echo "status=published (OIDC)" >> "$GITHUB_OUTPUT"

      - name: Publish to Open VSX Registry
        id: openvsx
        if: inputs.dry_run != true && (github.event_name == 'push' || inputs.publish_openvsx == true)
        working-directory: packages/vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx -y ovsx@latest publish "${{ steps.package.outputs.vsix }}" -p "$OVSX_PAT"
            echo "status=published (token)" >> "$GITHUB_OUTPUT"
          else
            npx -y ovsx@latest publish "${{ steps.package.outputs.vsix }}"
            echo "status=published (OIDC)" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## RankCLI VS Code Extension" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package:** \`${{ steps.package.outputs.vsix }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **VS Code Marketplace:** ${{ steps.marketplace.outputs.status || 'skipped' }} — https://marketplace.visualstudio.com/items?itemName=Integrallis.rankcli-vscode" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Open VSX:** ${{ steps.openvsx.outputs.status || 'skipped' }} — https://open-vsx.org/extension/Integrallis/rankcli-vscode" >> "$GITHUB_STEP_SUMMARY"
