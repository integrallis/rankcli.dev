# SEO Autopilot - Automated SEO Monitoring
# This workflow runs scheduled SEO audits and tracking

name: SEO Monitoring

on:
  # Scheduled runs
  schedule:
    - cron: '0 9 * * 1'

  # Manual trigger
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - audit-only
          - track-only

  # Run on main branch pushes (optional)
  # push:
  #   branches: [main]

env:
  SITE_URL: 'https://rankcli.dev'

jobs:
  seo-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install RankCLI
        run: npm install -g @rankcli/cli

      
      - name: Run SEO Audit
        if: ${{ inputs.mode != 'track-only' }}
        env:
          RANKCLI_API_KEY: ${{ secrets.RANKCLI_API_KEY }}
        run: |
          rankcli audit --url "$SITE_URL" --output json > audit-report.json
      

      - name: Generate Report
        id: report
        run: |
          # Format audit results as markdown
          echo "# SEO Audit Report" > seo-report.md
          echo "" >> seo-report.md
          echo "**Site:** $SITE_URL" >> seo-report.md
          echo "**Date:** $(date -u +%Y-%m-%d)" >> seo-report.md
          echo "" >> seo-report.md
          cat audit-report.json | jq -r '"## Score: \(.score)/100\n\n### Issues Found: \(.issues | length)\n"' >> seo-report.md || true

          # Set output for issue creation
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat seo-report.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      
      - name: Create/Update Issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'SEO Report - ' + new Date().toISOString().split('T')[0];
            const body = `${{ steps.report.outputs.report }}`;

            // Find existing issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'seo-report',
              state: 'open'
            });

            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body
              });
              console.log('Updated issue #' + issues.data[0].number);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['seo-report', 'automated']
              });
              console.log('Created new SEO report issue');
            }
      

      
      - name: Auto-fix Issues
        id: autofix
        env:
          RANKCLI_API_KEY: ${{ secrets.RANKCLI_API_KEY }}
        run: |
          # Run auto-fixer for safe, non-breaking changes
          rankcli apply --url "$SITE_URL" --auto > fixes.log 2>&1 || true

          # Surface the step's own output in the job log — previously this
          # was captured into fixes.log and never printed or uploaded, so a
          # silent failure here (e.g. RANKCLI_API_KEY not resolving to a
          # paid tier, which gates auto-fix) was invisible in the Actions UI.
          cat fixes.log

          # Check if any fixes were made (look for file changes)
          if git diff --quiet; then
            echo "fixes_made=false" >> $GITHUB_OUTPUT
          else
            echo "fixes_made=true" >> $GITHUB_OUTPUT

            # `rankcli apply` doesn't write a structured per-fix description
            # file anywhere we can read after the fact — its fix list only
            # exists in its own stdout, captured above into fixes.log. The
            # honest, verifiable "changes made" list is the actual changed
            # file paths from git, not a reconstructed description.
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            git diff --name-only | sed 's/^/- /' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create PR with Fixes
        if: steps.autofix.outputs.fixes_made == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix(seo): automated SEO improvements'
          title: '🔧 SEO Auto-Fix: Automated Improvements'
          body: |
            ## Automated SEO Fixes

            This PR was automatically generated by SEO Autopilot.

            ### Files Changed
            ${{ steps.autofix.outputs.changes }}

            ### Review Checklist
            - [ ] Changes look correct
            - [ ] No unintended modifications
            - [ ] Tests pass

            ---
            🤖 Generated by [RankCLI](https://rankcli.dev)
          branch: seo-autofix-${{ github.run_number }}
          labels: seo, automated
      

      - name: Save Report Artifact
        uses: actions/upload-artifact@v7
        with:
          name: seo-report-${{ github.run_number }}
          path: |
            seo-report.md
            audit-report.json
            fixes.log
          retention-days: 90

      
