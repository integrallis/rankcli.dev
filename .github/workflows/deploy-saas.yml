name: Deploy SaaS

on:
  push:
    branches: [main]
    paths:
      - 'packages/saas/**'
      - '.github/workflows/deploy-saas.yml'
  workflow_dispatch:
    inputs:
      sync_stripe_pricing:
        description: 'Force sync Stripe pricing'
        required: false
        default: 'false'
        type: boolean
      deploy_functions:
        description: 'Force deploy edge functions'
        required: false
        default: 'false'
        type: boolean

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

jobs:
  # ============================================
  # Preflight: Validate secrets exist
  # ============================================
  preflight:
    name: Preflight Check
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - name: Check Required Secrets
        id: check
        run: |
          missing=""

          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            missing="$missing SUPABASE_ACCESS_TOKEN"
          fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_KEY }}" ]; then
            missing="$missing SUPABASE_SERVICE_KEY"
          fi
          if [ -z "${{ secrets.STRIPE_SECRET_KEY }}" ]; then
            missing="$missing STRIPE_SECRET_KEY"
          fi
          if [ -z "${{ vars.SUPABASE_PROJECT_REF }}" ]; then
            missing="$missing SUPABASE_PROJECT_REF (variable)"
          fi

          if [ -n "$missing" ]; then
            echo "❌ Missing secrets:$missing"
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ All required secrets present"
          echo "has_secrets=true" >> $GITHUB_OUTPUT

  # ============================================
  # Detect what changed
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      functions: ${{ steps.filter.outputs.functions }}
      migrations: ${{ steps.filter.outputs.migrations }}
      pricing: ${{ steps.filter.outputs.pricing }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'packages/saas/src/**'
              - 'packages/saas/index.html'
              - 'packages/saas/package.json'
              - 'packages/saas/vite.config.ts'
              - 'packages/saas/tailwind.config.ts'
            functions:
              - 'packages/saas/supabase/functions/**'
            migrations:
              - 'packages/saas/supabase/migrations/**'
            pricing:
              - 'packages/saas/src/config/pricing-tiers.json'

  # ============================================
  # Build & Deploy Frontend
  # ============================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [preflight, changes]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/saas

      - name: Build
        run: pnpm build
        working-directory: packages/saas
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      # Deploy to Cloudflare Pages (or Vercel, Netlify, etc.)
      - name: Deploy to Cloudflare Pages
        if: vars.CLOUDFLARE_PROJECT_NAME != ''
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          directory: packages/saas/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Alternative: Deploy to Vercel
      - name: Deploy to Vercel
        if: vars.VERCEL_PROJECT_ID != '' && vars.CLOUDFLARE_PROJECT_NAME == ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID }}
          working-directory: packages/saas
          vercel-args: '--prod'

  # ============================================
  # Database Migrations & Edge Functions
  # ============================================
  migrate:
    name: Migrations & Functions
    runs-on: ubuntu-latest
    needs: [preflight, changes]
    if: |
      needs.changes.outputs.migrations == 'true' ||
      needs.changes.outputs.functions == 'true' ||
      github.event.inputs.deploy_functions == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: |
          supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        working-directory: packages/saas

      - name: Run Migrations
        if: needs.changes.outputs.migrations == 'true'
        run: |
          supabase db push
        working-directory: packages/saas

      - name: Set Edge Function Secrets
        run: |
          # Required secrets
          supabase secrets set \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            APP_URL="${{ vars.APP_URL }}"
          
          # Optional API keys - only set if present
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            supabase secrets set OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          fi
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            supabase secrets set ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          fi
          if [ -n "${{ secrets.GOOGLE_API_KEY }}" ]; then
            supabase secrets set GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}"
          fi
          if [ -n "${{ secrets.PERPLEXITY_API_KEY }}" ]; then
            supabase secrets set PERPLEXITY_API_KEY="${{ secrets.PERPLEXITY_API_KEY }}"
          fi
        working-directory: packages/saas

      - name: Deploy Edge Functions
        run: |
          # Deploy all edge functions
          for fn in packages/saas/supabase/functions/*/; do
            fn_name=$(basename "$fn")
            # Skip shared folder
            if [ "$fn_name" != "_shared" ]; then
              echo "Deploying function: $fn_name"
              supabase functions deploy "$fn_name" --no-verify-jwt
            fi
          done
        working-directory: .

  # ============================================
  # Sync Stripe Pricing
  # ============================================
  sync-stripe:
    name: Sync Stripe Pricing
    runs-on: ubuntu-latest
    needs: [preflight, changes, migrate]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.changes.outputs.pricing == 'true' || github.event.inputs.sync_stripe_pricing == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/saas

      - name: Sync Pricing to Stripe & Supabase
        run: pnpm seed:pricing:stripe
        working-directory: packages/saas
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

  # ============================================
  # Summary
  # ============================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [preflight, changes, deploy-frontend, migrate, sync-stripe]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Preflight | ${{ needs.preflight.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations | ${{ needs.migrate.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stripe Sync | ${{ needs.sync-stripe.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.changes.outputs.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "- Functions: ${{ needs.changes.outputs.functions }}" >> $GITHUB_STEP_SUMMARY
          echo "- Migrations: ${{ needs.changes.outputs.migrations }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pricing: ${{ needs.changes.outputs.pricing }}" >> $GITHUB_STEP_SUMMARY
