# =============================================================================
# CLI Native Release - Homebrew + Scoop
# =============================================================================
# Builds standalone, dependency-free rankcli binaries (Node Single
# Executable Applications - no Node install required to run them) for
# five platforms, uploads them to a GitHub release on the PUBLIC
# integrallis/rankcli-cli repo (not this one - rankcli.dev is private,
# and Homebrew/Scoop fetch release asset URLs anonymously at install
# time, which 404s against a private repo's releases no matter how
# correct the formula/manifest are - confirmed the hard way), then
# publishes a Homebrew formula and Scoop manifest pointing at those
# binaries.
#
# Mirrors the pattern already proven out in ModelJars'
# .github/workflows/cli-release.yml (same tap/bucket repos, same
# publish-packages job shape) - the only real difference is the artifact
# itself: ModelJars compiles a true native binary via GraalVM (Java),
# this bundles the CLI's TypeScript source into a single file via esbuild
# and injects it into a copy of the Node runtime via Node's SEA feature
# (scripts/build-sea.sh has the full story, including a real bug that
# only shows up in a true single-file build: config injection assumed
# sibling files on disk that a SEA binary doesn't have).
#
# Triggers:
# - release: published (uses the release's own tag)
# - workflow_dispatch (manual re-run against an existing tag, e.g. to
#   retry a failed publish without cutting a new release)

name: CLI native release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that receives the binaries, for example v0.0.22.
        required: true
        type: string
      ref:
        description: Git ref to build; defaults to the release tag.
        required: false
        type: string

permissions:
  contents: write

env:
  PNPM_VERSION: '8'
  PUBLIC_REPO: integrallis/rankcli-cli

jobs:
  ensure-public-release:
    name: Ensure public release exists
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release context
        id: release
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The public release is not just where Homebrew and Scoop fetch binaries - it is the
      # only release page anyone outside the org can open, and rankcli.dev/changelog sends
      # people to it for "the full, version-by-version history". It used to say "Binaries for
      # rankcli vX. Source: <link to a private repo>", so every announcement of a release
      # landed on a content-free stub above a 404. The notes written on the source release
      # come along now, and the "Source:" line only appears when it points somewhere the
      # reader can actually go.
      - name: Create release on public repo if missing
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists on $PUBLIC_REPO"
            exit 0
          fi

          {
            if [ -n "$RELEASE_BODY" ]; then
              printf '%s\n\n---\n\n' "$RELEASE_BODY"
            fi
            printf '## Install\n\n'
            printf '```bash\n'
            printf 'npm install -g @rankcli/cli    # or: brew install integrallis/tap/rankcli\n'
            printf '```\n\n'
            printf 'Standalone binaries for macOS, Linux and Windows are attached below - no Node install required.\n'
          } > public-notes.md

          gh release create "$TAG" --repo "$PUBLIC_REPO" \
            --title "${RELEASE_TITLE:-$TAG}" \
            --notes-file public-notes.md

  # Claude Desktop installs extensions from a .mcpb bundle rather than by hand-editing
  # claude_desktop_config.json. We shipped none, so the audience this product is most aimed at
  # had the highest-friction install path of anyone. Built here and attached to the public
  # release, which is the only release page a non-member can open.
  desktop-extension:
    name: Claude Desktop extension (.mcpb)
    needs: ensure-public-release
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release context
        id: release
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || steps.release.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build agent-runtime
        working-directory: packages/agent-runtime
        run: pnpm build

      - name: Build the bundle
        working-directory: packages/mcp-server
        run: |
          pnpm build
          pnpm build:mcpb

      - name: Smoke-test it the way Claude Desktop runs it
        working-directory: packages/mcp-server
        run: |
          # A bundle that unzips but does not speak MCP is worse than no bundle: the user gets a
          # silent failure inside Claude rather than a missing feature.
          mkdir -p /tmp/mcpb-check && unzip -q -o rankcli-*.mcpb -d /tmp/mcpb-check
          node -e '
            const { spawn } = require("node:child_process");
            const p = spawn("node", ["/tmp/mcpb-check/server/index.js"]);
            let out = "";
            p.stdout.on("data", (d) => (out += d));
            p.stdin.write(JSON.stringify({jsonrpc:"2.0",id:1,method:"initialize",params:{protocolVersion:"2025-06-18",capabilities:{},clientInfo:{name:"ci",version:"1"}}}) + "\n");
            setTimeout(() => p.stdin.write(JSON.stringify({jsonrpc:"2.0",id:2,method:"tools/list",params:{}}) + "\n"), 1500);
            setTimeout(() => {
              let version = null, tools = 0;
              for (const line of out.split("\n").filter(Boolean)) {
                try {
                  const j = JSON.parse(line);
                  if (j.id === 1) version = j.result?.serverInfo?.version;
                  if (j.id === 2) tools = (j.result?.tools || []).length;
                } catch {}
              }
              p.kill();
              console.log("version", version, "tools", tools);
              // 0.0.0 means the package.json at the bundle root went missing: server.ts
              // resolves its version through require("../package.json") and falls back silently.
              if (!version || version === "0.0.0") { console.error("bundle reports no version"); process.exit(1); }
              if (tools < 10) { console.error("bundle exposed " + tools + " tools"); process.exit(1); }
            }, 7000);
          '

      - name: Attach to the public release
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
        working-directory: packages/mcp-server
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" rankcli-*.mcpb \
            --clobber --repo "$PUBLIC_REPO"

  native:
    name: ${{ matrix.label }}
    needs: ensure-public-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x86_64
            binary: rankcli
          - runner: ubuntu-24.04-arm
            label: linux-aarch64
            binary: rankcli
          - runner: macos-15-intel
            label: macos-x86_64
            binary: rankcli
          - runner: macos-15
            label: macos-aarch64
            binary: rankcli
          - runner: windows-2025
            label: windows-x86_64
            binary: rankcli.exe

    steps:
      - name: Resolve release context
        id: release
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || steps.release.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # >=20 for SEA support; 22 matches what build-cli.yml's publish
          # job already uses elsewhere in this repo.
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Set CLI version from release tag
        shell: bash
        working-directory: packages/cli
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          sed -i.bak "s|\"version\": \"[^\"]*\"|\"version\": \"${VERSION}\"|" package.json
          rm -f package.json.bak
          node scripts/update-version.js

      - name: Build agent-runtime
        working-directory: packages/agent-runtime
        run: pnpm build

      - name: Build SEA binary
        shell: bash
        working-directory: packages/cli
        env:
          RANKCLI_SUPABASE_URL: ${{ secrets.RANKCLI_SUPABASE_URL }}
          RANKCLI_SUPABASE_ANON_KEY: ${{ secrets.RANKCLI_SUPABASE_ANON_KEY }}
          RANKCLI_WEB_URL: https://rankcli.dev
        run: bash scripts/build-sea.sh "${{ matrix.label }}" "dist-native/${{ matrix.binary }}"

      - name: Smoke-test binary
        shell: bash
        working-directory: packages/cli
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          binary="dist-native/${{ matrix.binary }}"
          test -f "$binary"
          if [ "${{ runner.os }}" != "Windows" ]; then
            test -x "$binary"
          fi
          version_output="$("$binary" --version)"
          echo "Reported version: $version_output"
          [ "$version_output" = "$VERSION" ] || { echo "::error::version mismatch: expected $VERSION, got $version_output"; exit 1; }
          "$binary" audit --url https://rankcli.dev --output json > /dev/null

      - name: Package release asset
        id: package
        shell: bash
        working-directory: packages/cli
        run: |
          raw="rankcli-${{ matrix.label }}${{ runner.os == 'Windows' && '.exe' || '' }}"
          mkdir -p dist-upload
          cp "dist-native/${{ matrix.binary }}" "dist-upload/$raw"
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "dist-upload/$raw"
          fi
          echo "raw=$raw" >> "$GITHUB_OUTPUT"

      - name: Upload asset to public release
        shell: bash
        working-directory: packages/cli
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
        run: >-
          gh release upload "${{ steps.release.outputs.tag }}" "dist-upload/${{ steps.package.outputs.raw }}"
          --clobber --repo "${{ env.PUBLIC_REPO }}"

  publish-packages:
    name: Publish Homebrew and Scoop
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve context and credentials
        id: context
        env:
          TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PACKAGES_PUBLISH_TOKEN is absent; skipping Homebrew and Scoop."
          fi

      - name: Checkout packaging templates
        if: steps.context.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Download binaries and calculate checksums
        if: steps.context.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
          TAG: ${{ steps.context.outputs.tag }}
        run: |
          mkdir dist
          gh release download "$TAG" --repo "${{ env.PUBLIC_REPO }}" --dir dist \
            --pattern 'rankcli-linux-x86_64' \
            --pattern 'rankcli-linux-aarch64' \
            --pattern 'rankcli-macos-x86_64' \
            --pattern 'rankcli-macos-aarch64' \
            --pattern 'rankcli-windows-x86_64.exe'
          {
            echo "SHA_LINUX_X64=$(sha256sum dist/rankcli-linux-x86_64 | cut -d' ' -f1)"
            echo "SHA_LINUX_ARM=$(sha256sum dist/rankcli-linux-aarch64 | cut -d' ' -f1)"
            echo "SHA_MAC_X64=$(sha256sum dist/rankcli-macos-x86_64 | cut -d' ' -f1)"
            echo "SHA_MAC_ARM=$(sha256sum dist/rankcli-macos-aarch64 | cut -d' ' -f1)"
            echo "SHA_WIN_X64=$(sha256sum dist/rankcli-windows-x86_64.exe | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Publish Homebrew formula
        if: steps.context.outputs.ready == 'true'
        env:
          TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
          VERSION: ${{ steps.context.outputs.version }}
          BASE: https://github.com/${{ env.PUBLIC_REPO }}/releases/download/${{ steps.context.outputs.tag }}
        run: |
          variables='${VERSION} ${BASE} ${SHA_LINUX_X64} ${SHA_LINUX_ARM} ${SHA_MAC_X64} ${SHA_MAC_ARM}'
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/integrallis/homebrew-tap.git" tap
          envsubst "$variables" < packages/cli/packaging/rankcli.rb > tap/Formula/rankcli.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rankcli.rb
          git commit -m "rankcli ${VERSION}" && git push || echo "No formula change"

      - name: Publish Scoop manifest
        if: steps.context.outputs.ready == 'true'
        env:
          TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
          VERSION: ${{ steps.context.outputs.version }}
          BASE: https://github.com/${{ env.PUBLIC_REPO }}/releases/download/${{ steps.context.outputs.tag }}
        run: |
          variables='${VERSION} ${BASE} ${SHA_WIN_X64}'
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/integrallis/scoop-bucket.git" bucket
          envsubst "$variables" < packages/cli/packaging/rankcli.json > bucket/bucket/rankcli.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/rankcli.json
          git commit -m "rankcli ${VERSION}" && git push || echo "No manifest change"
