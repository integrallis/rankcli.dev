name: One-off Setup Email Routing
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Email Routing and add forwarding rule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=rankcli.dev" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id')
          echo "Zone ID: $ZONE_ID"

          echo "=== Enabling Email Routing (auto-provisions MX/TXT) ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing/enable" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq '.'

          echo "=== Attempting to add destination address bsbodden@integrallis.com ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/email/routing/addresses" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"email":"bsbodden@integrallis.com"}' | jq '.'

          echo "=== Listing destination addresses (to check verification status) ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/email/routing/addresses" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.'

          echo "=== Final email routing zone status ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.'
