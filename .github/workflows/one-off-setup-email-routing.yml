name: One-off Setup Email Routing
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Add forwarding rule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=rankcli.dev" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id')
          echo "Zone ID: $ZONE_ID"

          echo "=== Attempting to re-check destination addresses (account-level, may still be blocked) ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/email/routing/addresses" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.'

          echo "=== Creating routing rule: brian@rankcli.dev -> bsbodden@integrallis.com ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing/rules" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{
              "matchers": [{"type": "literal", "field": "to", "value": "brian@rankcli.dev"}],
              "actions": [{"type": "forward", "value": ["bsbodden@integrallis.com"]}],
              "enabled": true,
              "name": "brian -> bsbodden@integrallis.com"
            }' | jq '.'

          echo "=== Listing all routing rules ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing/rules" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.'
