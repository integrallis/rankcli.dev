# Repair for www.rankcli.dev, which answers HTTP 522 while the apex serves fine. Every inbound
# link, directory listing or pasted URL using www has been hitting a Cloudflare error page, and
# we sell an SEO tool.
#
# Two earlier runs ruled out everything except one cause:
#   - DNS is already correct and identical in shape to the working apex:
#       www.rankcli.dev  CNAME -> rankcli.pages.dev  proxied
#   - the token has Zone:Read and DNS:Edit, but NOT Rulesets:Edit ("Authentication error",
#     code 10000), so a zone-level www-to-apex 301 is not available to us
#   - www is already attached to the Pages project, so re-adding it is refused
#   - and the Pages project reports:
#       rankcli.dev      status active        validation active
#       www.rankcli.dev  status deactivated   validation error
#
# That last line is the whole bug. The custom domain is attached but its validation failed, so
# Pages refuses to serve it and Cloudflare proxies to nothing: 522 exactly. DNS changes cannot
# fix it because DNS was never wrong.
#
# So: ask Pages to revalidate. If that does not take, detach and reattach, which forces fresh
# validation and certificate issuance. Detaching a domain that is already returning 522 cannot
# make anything worse, and the apex is never touched.
#
# Safe to re-run.
name: Fix www domain

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Revalidate the www custom domain
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          D=https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/rankcli/domains

          status() { api "$D" | jq -r '.result[]? | select(.name=="www.rankcli.dev") | "\(.status)/\(.validation_data.status)"'; }

          echo "before: $(status)"

          echo "::group::Ask Pages to revalidate"
          api -X PATCH "$D/www.rankcli.dev" -d '{}' | jq '{success, errors}'
          echo "::endgroup::"

          for i in $(seq 1 6); do
            sleep 15
            S=$(status)
            echo "after revalidate, attempt $i: $S"
            [ "${S%%/*}" = "active" ] && { echo "DONE=1" >> "$GITHUB_ENV"; exit 0; }
          done

          echo "::group::Still not active. Detaching and reattaching."
          api -X DELETE "$D/www.rankcli.dev" | jq '{success, errors}'
          sleep 10
          api -X POST "$D" -d '{"name":"www.rankcli.dev"}' | jq '{success, errors, name: .result.name, status: .result.status}'
          echo "::endgroup::"

          for i in $(seq 1 20); do
            sleep 20
            S=$(status)
            echo "after reattach, attempt $i: $S"
            [ "${S%%/*}" = "active" ] && { echo "DONE=1" >> "$GITHUB_ENV"; exit 0; }
          done

          echo "www.rankcli.dev is still not active on the Pages project."
          echo "Last status: $(status)"
          exit 1

      - name: Verify it actually serves
        run: |
          echo "Certificate issuance can lag activation by a few minutes."
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://www.rankcli.dev/ || echo 000)
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              if curl -s --max-time 20 https://www.rankcli.dev/ | grep -q "rdt('init'"; then
                echo "www serves the real site, pixel included."
                exit 0
              fi
              echo "200 but the page content looks wrong."
              exit 1
            fi
            case "$CODE" in 301|308) echo "www redirects to the apex."; exit 0 ;; esac
            sleep 20
          done
          echo "Pages reports the domain active but it is still not serving."
          exit 1
