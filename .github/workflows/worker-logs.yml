name: Worker Logs

# Ops: recent audit-worker logs and machine state from Fly, for diagnosing jobs that die.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Optional filter (grep -E pattern)'
        required: false
        default: ''

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Machines
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl machine list --app rankcli-audit-worker
      - name: Recent logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FILTER: ${{ github.event.inputs.grep }}
        run: |
          flyctl logs --app rankcli-audit-worker --no-tail > logs.txt 2>&1 || true
          if [ -n "$FILTER" ]; then grep -E "$FILTER" logs.txt | tail -200; else tail -300 logs.txt; fi
      # CPU per machine over the last 30 minutes, from Fly's Prometheus API. Shared CPUs run on
      # a small baseline share plus a burst balance; "throttled" time means the balance ran out.
      - name: CPU (last 30 min)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          ORG=$(flyctl status --app rankcli-audit-worker --json | jq -r '.Organization.Slug // "personal"')
          echo "org: $ORG"
          # Macaroon tokens ("FlyV1 fm2_...") go in the header as they are; classic ones as Bearer.
          case "$FLY_API_TOKEN" in FlyV1*) AUTH="$FLY_API_TOKEN" ;; *) AUTH="Bearer $FLY_API_TOKEN" ;; esac
          prom() {
            out=$(curl -s -G "https://api.fly.io/prometheus/$ORG/api/v1/query" -H "Authorization: $AUTH" --data-urlencode "query=$1")
            echo "$out" | jq -c '.data.result[]? | {instance: .metric.instance, mode: .metric.mode, value: .value[1]}' 2>/dev/null \
              || echo "(not JSON: $(echo "$out" | head -c 200))"
          }
          echo "--- CPU metric names ---"
          out=$(curl -s -G "https://api.fly.io/prometheus/$ORG/api/v1/label/__name__/values" -H "Authorization: $AUTH")
          echo "$out" | jq -r '.data[]? | select(test("cpu"))' 2>/dev/null || echo "(not JSON: $(echo "$out" | head -c 200))"
          echo "--- CPU seconds per second by mode, 30m average ---"
          prom 'sum by (instance, mode) (rate(fly_instance_cpu{app="rankcli-audit-worker"}[30m]))'
          echo "--- throttled seconds per second, 30m average ---"
          prom 'sum by (instance) (rate(fly_instance_cpu_throttle{app="rankcli-audit-worker"}[30m]))'
          echo "--- CPU balance now ---"
          prom 'fly_instance_cpu_balance{app="rankcli-audit-worker"}'
