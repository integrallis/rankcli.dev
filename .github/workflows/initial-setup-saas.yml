name: Initial Setup - SaaS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "SETUP" to confirm initial setup'
        required: true
        type: string

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
  DOMAIN: rankcli.dev
  CLOUDFLARE_PAGES_DOMAIN: rankcli.pages.dev

jobs:
  # ============================================
  # Validate confirmation
  # ============================================
  validate:
    name: Validate Setup Request
    runs-on: ubuntu-latest
    steps:
      - name: Check Confirmation
        if: github.event.inputs.confirm != 'SETUP'
        run: |
          echo "❌ Please type 'SETUP' to confirm initial setup"
          exit 1

      - name: Check Required Secrets
        run: |
          missing=""

          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            missing="$missing SUPABASE_ACCESS_TOKEN"
          fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_KEY }}" ]; then
            missing="$missing SUPABASE_SERVICE_KEY"
          fi
          if [ -z "${{ secrets.STRIPE_SECRET_KEY }}" ]; then
            missing="$missing STRIPE_SECRET_KEY"
          fi
          if [ -z "${{ vars.SUPABASE_PROJECT_REF }}" ]; then
            missing="$missing SUPABASE_PROJECT_REF (variable)"
          fi

          if [ -n "$missing" ]; then
            echo "❌ Missing secrets:$missing"
            echo ""
            echo "Please configure the following in your repository settings:"
            echo ""
            echo "Secrets (Settings > Secrets and variables > Actions > Secrets):"
            echo "  - SUPABASE_ACCESS_TOKEN: Your Supabase access token"
            echo "  - SUPABASE_SERVICE_KEY: Your Supabase service role key"
            echo "  - SUPABASE_ANON_KEY: Your Supabase anon key"
            echo "  - STRIPE_SECRET_KEY: Your Stripe secret key (sk_live_... or sk_test_...)"
            echo "  - STRIPE_PUBLISHABLE_KEY: Your Stripe publishable key"
            echo "  - DNSIMPLE_TOKEN: Your DNSimple API token"
            echo "  - DNSIMPLE_ACCOUNT_ID: Your DNSimple account ID"
            echo "  - FLY_API_TOKEN: Your Fly.io API token"
            echo ""
            echo "Variables (Settings > Secrets and variables > Actions > Variables):"
            echo "  - SUPABASE_PROJECT_REF: Your Supabase project reference (e.g., abcdefghijklmnop)"
            echo "  - APP_URL: Your app URL (e.g., https://rankcli.dev)"
            exit 1
          fi

          echo "✅ All required secrets present"

  # ============================================
  # Setup DNS Records (DNSimple)
  # ============================================
  setup-dns:
    name: Setup DNS Records
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Setup DNS Records
        env:
          DNSIMPLE_TOKEN: ${{ secrets.DNSIMPLE_TOKEN }}
          DNSIMPLE_ACCOUNT_ID: ${{ secrets.DNSIMPLE_ACCOUNT_ID }}
        run: |
          if [ -z "$DNSIMPLE_TOKEN" ]; then
            echo "⚠️ DNSIMPLE_TOKEN not set, skipping DNS setup"
            exit 0
          fi
         
          echo "🌐 Setting up DNS records for ${{ env.DOMAIN }}..."
          
          # Function to create or update a record (idempotent)
          upsert_record() {
            local name="$1"
            local type="$2"
            local content="$3"
            local ttl="${4:-3600}"
            
            # Check if record exists
            existing=$(curl -s -H "Authorization: Bearer $DNSIMPLE_TOKEN" \
              "https://api.dnsimple.com/v2/$DNSIMPLE_ACCOUNT_ID/zones/${{ env.DOMAIN }}/records?name=$name&type=$type")
            
            record_id=$(echo "$existing" | jq -r '.data[0].id // empty')
            
            if [ -n "$record_id" ]; then
              echo "  Updating existing $type record for '$name'..."
              curl -s -X PATCH \
                -H "Authorization: Bearer $DNSIMPLE_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"content\":\"$content\",\"ttl\":$ttl}" \
                "https://api.dnsimple.com/v2/$DNSIMPLE_ACCOUNT_ID/zones/${{ env.DOMAIN }}/records/$record_id" | jq .
            else
              echo "  Creating $type record for '$name'..."
              curl -s -X POST \
                -H "Authorization: Bearer $DNSIMPLE_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"name\":\"$name\",\"type\":\"$type\",\"content\":\"$content\",\"ttl\":$ttl}" \
                "https://api.dnsimple.com/v2/$DNSIMPLE_ACCOUNT_ID/zones/${{ env.DOMAIN }}/records" | jq .
            fi
          }
          
          # Root domain → Cloudflare Pages
          upsert_record "" "CNAME" "${{ env.CLOUDFLARE_PAGES_DOMAIN }}"
          
          # www subdomain → Cloudflare Pages  
          upsert_record "www" "CNAME" "${{ env.CLOUDFLARE_PAGES_DOMAIN }}"
          
          echo "✅ DNS records configured"

  # ============================================
  # Setup Fly.io App
  # ============================================
  setup-flyio:
    name: Setup Fly.io App
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly.io App (idempotent)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "🚀 Setting up Fly.io app..."
          flyctl apps create rankcli-audit-worker 2>/dev/null || echo "App already exists"
          echo "✅ Fly.io app ready: rankcli-audit-worker"

  # ============================================
  # Initial Database Setup
  # ============================================
  setup-database:
    name: Setup Database
    runs-on: ubuntu-latest
    needs: [validate, setup-dns, setup-flyio]
    if: always() && needs.validate.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: |
          supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        working-directory: packages/saas

      - name: Run Initial Migrations
        run: |
          echo "📦 Running database migrations..."
          supabase db push
        working-directory: packages/saas

      - name: Verify Tables Created
        run: |
          echo "✅ Database setup complete"
          echo "Tables should now exist: subscription_plans, user_subscriptions, projects, audits, etc."

  # ============================================
  # Setup Stripe
  # ============================================
  setup-stripe:
    name: Setup Stripe
    runs-on: ubuntu-latest
    needs: setup-database
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/saas

      - name: Create Stripe Products & Sync Pricing
        run: pnpm seed:pricing:stripe
        working-directory: packages/saas
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Setup Stripe Webhook
        run: pnpm setup:stripe
        working-directory: packages/saas
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

  # ============================================
  # Deploy Edge Functions
  # ============================================
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: setup-stripe
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: |
          supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        working-directory: packages/saas

      - name: Set Edge Function Secrets
        run: |
          supabase secrets set \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            AUDIT_WORKER_URL="https://rankcli-audit-worker.fly.dev" \
            AUDIT_WORKER_SECRET="${{ secrets.AUDIT_WORKER_SECRET }}" \
            APP_URL="https://${{ env.DOMAIN }}"
        working-directory: packages/saas

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy create-checkout --no-verify-jwt
          supabase functions deploy stripe-webhook --no-verify-jwt
          supabase functions deploy create-portal --no-verify-jwt
          supabase functions deploy free-audit --no-verify-jwt
          supabase functions deploy ai-keywords --no-verify-jwt
        working-directory: packages/saas

  # ============================================
  # Build & Deploy Frontend
  # ============================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-functions
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/saas

      - name: Build
        run: pnpm build
        working-directory: packages/saas
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      # Deploy to Cloudflare Pages
      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Create Cloudflare Pages Project (if not exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages project create rankcli --production-branch=main 2>/dev/null || echo "Project already exists"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name=rankcli --branch=main --commit-dirty=true
        working-directory: packages/saas

  # ============================================
  # Summary
  # ============================================
  summary:
    name: Setup Summary
    runs-on: ubuntu-latest
    needs: [validate, setup-dns, setup-flyio, setup-database, setup-stripe, deploy-functions, deploy-frontend]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Initial Setup Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DNS (DNSimple) | ${{ needs.setup-dns.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fly.io App | ${{ needs.setup-flyio.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database | ${{ needs.setup-database.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stripe | ${{ needs.setup-stripe.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Edge Functions | ${{ needs.deploy-functions.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Domain**: https://${{ env.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: Cloudflare Pages (${{ env.CLOUDFLARE_PAGES_DOMAIN }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Audit Worker**: https://rankcli-audit-worker.fly.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Configure OAuth Providers**" >> $GITHUB_STEP_SUMMARY
          echo "   - Enable Google OAuth in Supabase Dashboard > Authentication > Providers" >> $GITHUB_STEP_SUMMARY
          echo "   - Enable GitHub OAuth in Supabase Dashboard > Authentication > Providers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. **Verify Stripe Webhook**" >> $GITHUB_STEP_SUMMARY
          echo "   - Check webhook is pointing to: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/stripe-webhook" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "3. **Test the Application**" >> $GITHUB_STEP_SUMMARY
          echo "   - Visit https://${{ env.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "   - Try the free audit tool" >> $GITHUB_STEP_SUMMARY
          echo "   - Sign up and test Stripe checkout" >> $GITHUB_STEP_SUMMARY
