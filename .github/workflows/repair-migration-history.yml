# =============================================================================
# One-off: Repair Supabase migration history, then push pending migrations
# =============================================================================
# `supabase db push` reported "Remote database is up to date" even though
# 20260903120000_add_founding_member_pricing.sql had never actually run
# (launch_offers table, get_launch_offer_availability(), and the
# pro_founding subscription_plans row were all missing). The remote
# supabase_migrations.schema_migrations table turned out to have zero
# entries for ANY timestamp-named migration file, old or new - so the
# CLI's local-vs-remote comparison was never seeing these as "pending" in
# the first place. `migration repair --status reverted` marks a version as
# not-applied in that tracking table so the next `db push` picks it up for
# real; it does not touch any other schema.
#
# Delete this workflow file once the repair has run successfully - it's a
# one-off fix, not something that should stay wired into CI.

name: Repair Migration History (one-off)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Migration version to mark reverted (forces re-apply on next db push)'
        required: true
        default: '20260903120000'

jobs:
  repair:
    name: Repair and re-push migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Mark migration reverted in tracking table
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration repair --status reverted ${{ github.event.inputs.version }}

      - name: Push pending migrations
        working-directory: packages/saas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
