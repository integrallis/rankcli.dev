# One-off: verify the new run-audit edge function end to end against the
# real production project, without needing a real GitHub App install or a
# service-role key on the local machine (neither is available outside CI).
# Creates a throwaway auth user + project + audit row, calls run-audit
# directly (the same request shape github-webhook/index.ts sends), checks
# the response and that audits/audit_issues actually got written, then
# deletes the throwaway user (cascades to project/audit/audit_issues via
# ON DELETE CASCADE). Delete this workflow file once run-audit is proven
# working - it's a diagnostic tool, not something that should stay wired
# into CI.

name: Smoke test run-audit (one-off)

on:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Create test data, call run-audit, verify, clean up
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run smoke test
        env:
          SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node <<'SCRIPT'
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const headers = {
            apikey: KEY,
            Authorization: `Bearer ${KEY}`,
            'Content-Type': 'application/json',
          };

          async function rest(path, opts = {}) {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
              ...opts,
              headers: { ...headers, ...(opts.headers || {}) },
            });
            const text = await res.text();
            let body;
            try { body = JSON.parse(text); } catch { body = text; }
            if (!res.ok) throw new Error(`${path} -> ${res.status}: ${JSON.stringify(body)}`);
            return body;
          }

          async function main() {
            const stamp = Date.now();
            const email = `rankcli-smoketest-${stamp}@rankcli.dev`;

            console.log('Creating throwaway auth user...');
            // Auth admin API lives under /auth/v1, not /rest/v1.
            const createUserRes = await fetch(`${SUPABASE_URL}/auth/v1/admin/users`, {
              method: 'POST',
              headers,
              body: JSON.stringify({ email, password: `sm0ke-${stamp}!`, email_confirm: true }),
            });
            const user = await createUserRes.json();
            if (!createUserRes.ok) throw new Error(`create user -> ${createUserRes.status}: ${JSON.stringify(user)}`);
            const userId = user.id;
            console.log('User created:', userId);

            console.log('Creating throwaway project...');
            const [project] = await rest('projects', {
              method: 'POST',
              headers: { Prefer: 'return=representation' },
              body: JSON.stringify({
                user_id: userId,
                name: 'run-audit smoke test',
                domain: 'rankcli.dev',
                url: 'https://rankcli.dev',
              }),
            });
            console.log('Project created:', project.id);

            console.log('Creating pending audit row...');
            const [audit] = await rest('audits', {
              method: 'POST',
              headers: { Prefer: 'return=representation' },
              body: JSON.stringify({
                project_id: project.id,
                triggered_by: 'api',
                status: 'pending',
              }),
            });
            console.log('Audit created:', audit.id);

            console.log('Calling run-audit...');
            const runAuditRes = await fetch(`${SUPABASE_URL}/functions/v1/run-audit`, {
              method: 'POST',
              headers,
              body: JSON.stringify({ auditId: audit.id }),
            });
            const runAuditBody = await runAuditRes.json();
            console.log('run-audit response:', runAuditRes.status, JSON.stringify(runAuditBody));
            if (!runAuditRes.ok) throw new Error('run-audit call failed');
            if (typeof runAuditBody.issuesFound !== 'number') {
              throw new Error('run-audit response missing numeric issuesFound - github-webhook depends on this field');
            }

            console.log('Verifying audits row was updated...');
            const [updatedAudit] = await rest(`audits?id=eq.${audit.id}&select=status,score,issues_found`);
            console.log('audits row now:', JSON.stringify(updatedAudit));
            if (updatedAudit.status !== 'completed') {
              throw new Error(`expected status=completed, got ${updatedAudit.status}`);
            }

            const issues = await rest(`audit_issues?audit_id=eq.${audit.id}&select=code,severity,status`);
            console.log(`audit_issues row count: ${issues.length}`);
            if (issues.length !== updatedAudit.issues_found) {
              throw new Error(`issues_found (${updatedAudit.issues_found}) doesn't match actual audit_issues rows (${issues.length})`);
            }

            console.log('Cleaning up (deleting throwaway user cascades project/audit/audit_issues)...');
            const delRes = await fetch(`${SUPABASE_URL}/auth/v1/admin/users/${userId}`, {
              method: 'DELETE',
              headers,
            });
            if (!delRes.ok) console.warn('cleanup delete failed:', delRes.status, await delRes.text());

            console.log('\n✅ run-audit smoke test passed');
          }

          main().catch((err) => {
            console.error('\n❌ smoke test failed:', err.message);
            process.exit(1);
          });
          SCRIPT
