name: One-off Check Email Routing
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check zone + email routing status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=rankcli.dev" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id')
          echo "Zone ID: $ZONE_ID"

          echo "=== Token verify (scopes/status) ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.result'

          echo "=== Email routing settings ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.'

          echo "=== Existing destination addresses (account-level) ==="
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/email/routing/addresses" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.'
