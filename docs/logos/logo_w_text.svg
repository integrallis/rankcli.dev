<svg xmlns="http://www.w3.org/2000/svg" width="280" height="48" viewBox="0 0 280 48">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&amp;display=swap');
    </style>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Logo icon scaled down -->
  <g fill="none" stroke="#21c45d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" transform="translate(4, 4)">
    <path d="M 8 8 L 20 20 L 8 32" />
    <line x1="24" y1="32" x2="36" y2="32">
      <animate
        attributeName="opacity"
        values="1; 0; 1"
        dur="1s"
        repeatCount="indefinite"
        calcMode="discrete"
        keyTimes="0; 0.5; 1" />
    </line>
  </g>
  <!-- RankCLI text in Bricolage Grotesque -->
  <text
    x="48"
    y="32"
    font-family="'Bricolage Grotesque', system-ui, sans-serif"
    font-weight="600"
    font-size="26"
    fill="#21c45d"
  >RankCLI</text>
</svg>
