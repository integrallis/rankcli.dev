services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3005:3005"
      - "8080:8080"
    command: sleep infinity
    environment:
      - ENVIRONMENT=development
      # For local dev, audit worker runs on localhost:8080
      - VITE_AUDIT_WORKER_URL=http://localhost:8080
      - VITE_AUDIT_WORKER_SECRET=dev-secret
    env_file:
      - ../.env
    networks:
      - seo-autopilot
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  seo-autopilot:
    driver: bridge
