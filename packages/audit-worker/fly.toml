# Fly.io configuration for RankCLI Audit Worker
# Deep audits for paid users (up to 20 pages, 5 minute timeout)

app = "rankcli-audit-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

# Secrets (set via: fly secrets set KEY=value)
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
# - OPENAI_API_KEY
# - WORKER_SECRET

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = "60s"
    timeout = "30s"
    grace_period = "60s"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# For production, consider:
# [[vm]]
#   memory = "2gb"
#   cpu_kind = "shared"
#   cpus = 2
