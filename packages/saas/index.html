<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fallback title only. Each page sets its own title, description,
         canonical, Open Graph tags and structured data with react-helmet-async
         (src/components/SEO.tsx), and the build prerenders them into each
         page's HTML. Don't add those tags here: Helmet can't remove static
         tags, so every page would carry the homepage's canonical. -->
    <title>RankCLI - Ship code, get ranked</title>
    <meta name="description" content="RankCLI is the developer-first SEO tool that runs 280+ automated checks and creates auto-fix pull requests via GitHub integration. Built for developers who ship code daily and need SEO that keeps up.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rankcli.dev/" />
    <meta property="og:title" content="RankCLI - Ship code, get ranked" />
    <meta property="og:description" content="RankCLI is the developer-first SEO tool that runs 280+ automated checks and creates auto-fix pull requests via GitHub integration. Built for developers who ship code daily and need SEO that keeps up." />
    <meta property="og:image" content="https://rankcli.dev/images/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://rankcli.dev/" />
    <meta name="twitter:title" content="RankCLI - Ship code, get ranked" />
    <meta name="twitter:description" content="RankCLI is the developer-first SEO tool that runs 280+ automated checks and creates auto-fix pull requests via GitHub integration. Built for developers who ship code daily and need SEO that keeps up." />
    <meta name="twitter:image" content="https://rankcli.dev/images/twitter-card.png" />

    <!-- JSON-LD Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "url": "https://rankcli.dev/",
      "logo": "https://rankcli.dev/images/logo.png",
      "name": "RankCLI",
      "description": "RankCLI is the developer-first SEO tool that runs 280+ automated checks and creates auto-fix pull requests via GitHub integration. Built for developers who ship code daily and need SEO that keeps up.",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-800-555-0199",
        "contactType": "Customer Support",
        "areaServed": "US"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "123 Main Street",
        "addressLocality": "Anytown",
        "addressRegion": "CA",
        "postalCode": "90210",
        "addressCountry": "US"
      },
      "sameAs": [
        "https://www.youtube.com/channel/your_youtube_channel",
        "https://twitter.com/rankcli",
        "https://www.linkedin.com/company/rankcli"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://rankcli.dev/",
      "name": "RankCLI",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://rankcli.dev/search?q={search_term}"
        },
        "query-input": "required name=search_term"
      }
    }
    </script>

    <!-- Theme & Icons -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="msapplication-TileColor" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preconnect & Preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/fonts/MonaSansVF-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ArchivoVF-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/MonaspaceKryptonVF-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/images/hero-image.jpg" as="image">

    <!-- Canonical -->
    <link rel="canonical" href="https://rankcli.dev/" />

    <!-- Analytics & Performance -->
    <link rel="dns-prefetch" href="//www.google-analytics.com" />

  </head>
